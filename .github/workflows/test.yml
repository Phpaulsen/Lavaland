name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Statische Prüfung (Syntax, Größe, IDs)
        run: node tests/static.mjs
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Rauchtest
        run: node tests/smoke.mjs
      - name: Offline-Test
        run: node tests/offline.mjs
      - name: Zufallstest
        run: FUZZ_SEC=45 node tests/fuzz.mjs
      - name: Update-Test (Spielstand von main)
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:index.html > "$RUNNER_TEMP/old.html"
          OLD="$RUNNER_TEMP/old.html" node tests/upgrade.mjs
