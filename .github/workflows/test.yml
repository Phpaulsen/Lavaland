name: Tests
on:
  pull_request:
  push:
    branches: [main]
  # Jede Nacht ein langer Lauf mit neuen Zufallswerten. Scheitert er, kommt eine Mail von GitHub; der Startwert im Log macht den Fehler nachspielbar.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LONG: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten (feste Versionen aus package-lock.json, ohne Install-Skripte)
        run: npm ci --ignore-scripts
      - name: Bekannte Schwachstellen (ab mittel) und Registry-Signaturen
        run: |
          npm audit --audit-level=moderate
          npm audit signatures
      - name: Bundle aktuell (index.html ist aus src/ gebaut)
        run: node tools/build.mjs --check
      - name: Bauen (index.html und Testbuild dist/index.test.html)
        run: node tools/build.mjs
      - name: Statische Prüfung (Syntax, Größe, IDs, Speicherschlüssel)
        run: node tests/static.mjs
      - name: Typprüfung (alle Module, app/wire.js bis zum Aufräumen ausgenommen)
        run: npx tsc -p .
      - name: Schichtregeln (deps.mjs) und Selbsttests der Umbauwerkzeuge
        run: |
          node tools/arch/deps.mjs --selftest
          node tools/arch/deps.mjs
          node tools/arch/movecheck.mjs --selftest
          node tools/arch/codemod.mjs --selftest
          node tools/arch/doc.mjs --selftest
      - name: Architekturdoku aktuell (docs/architecture/architecture.md)
        run: node tools/arch/doc.mjs --check
      - name: Move-Nachweis gegen main (tools/arch/moves.json)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          node tools/arch/movecheck.mjs --base FETCH_HEAD
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Rauchtest
        run: node tests/smoke.mjs
      - name: Golden Master (Welt, Speicherformat, Generatoren unverändert)
        run: node tests/golden.mjs
      - name: Produktionsbundle (echte CSP, kein Testzugang)
        run: node tests/prod.mjs
      - name: Spielstand-Test (Rettung, Datenbankstörung, Sichern/Laden)
        run: node tests/save.mjs
      - name: Offline-Test (kein Netz, langsames Netz, Serverfehler)
        run: node tests/offline.mjs
      - name: Zufallstest
        run: FUZZ_SEC=$([ "$LONG" = true ] && echo 600 || echo 45) node tests/fuzz.mjs
      - name: Knopftest (alle Fenster, alle Rätselstufen)
        run: CRAWL_N=$([ "$LONG" = true ] && echo 4000 || echo 300) node tests/crawl.mjs
      - name: Update-Test (Spielstand von main)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:index.html > "$RUNNER_TEMP/old.html"
          OLD="$RUNNER_TEMP/old.html" node tests/upgrade.mjs
      - name: Bildvergleich mit main (feste Szenen, Zeichenreihenfolge)
        if: github.event_name == 'pull_request'
        run: OLD="$RUNNER_TEMP/old.html" node tests/pixels.mjs
      - name: Vorlesetexte haben Aufnahmen
        run: |
          node tools/voice/collect.mjs > "$RUNNER_TEMP/texts.json"
          node tests/voice.mjs "$RUNNER_TEMP/texts.json"
