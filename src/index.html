<!doctype html><html><head><meta charset=utf8><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lavaland</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7fd0e8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lavaland"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
<!-- @css -->
</style>
<div id="sheet" aria-hidden="true"></div>

<canvas id="c" aria-label="Spielwelt mit Hügeln, Höhlen, Vulkan, Schneeberg, fremden Ländern, tiefen Zonen unter der Erde und dem Weltraum"></canvas>

<div class="hud">
  <div class="grid" id="grid"></div>
  <div class="row2">
  <button id="batt" aria-label="Lern-Akku aufladen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2L4 14h6l-1.5 8L19 10h-6z" fill="#ffd23f" stroke="#1d2a3a" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="cells" id="batt-cells"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></span></button>
  <button id="quest" aria-label="Auftrag anhören"><svg id="q-ic" viewBox="0 0 24 24" aria-hidden="true"></svg><span class="bar"><i id="q-bar"></i></span><b id="q-txt"></b></button>
  </div>
</div>

<div class="pad left">
  <button class="key" id="key-l" aria-label="Nach links"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4L7 12l9 8z" fill="currentColor"/></svg></button>
  <button class="key" id="key-r" aria-label="Nach rechts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l9 8-9 8z" fill="currentColor"/></svg></button>
</div>
<div class="pad right">
  <button id="mark" aria-label="Leuchtmarke setzen oder aufheben" hidden>🔆</button>
  <button id="act" aria-label="Aktion"></button>
  <div class="stack">
    <button class="key" id="key-u" aria-label="Nach oben"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l8-9 8 9z" fill="currentColor"/></svg></button>
    <button class="key" id="key-d" aria-label="Nach unten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l8 9 8-9z" fill="currentColor"/></svg></button>
  </div>
</div>

<div id="garage" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Fahrzeuge"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><div class="cards c4" id="garage-cards"></div></div>
</div>
<div id="toolbox" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Werkzeuge"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><div class="cards c4" id="tool-cards"></div></div>
</div>
<div id="magic" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Zauberkasten"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><div class="cards c3" id="magic-cards"></div></div>
</div>
<div id="finds" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Funde"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="loot">
      <span><b id="found-n">0/0</b></span>
    </div>
    <div class="album" id="album"></div>
    <div class="eggs" id="eggs"></div>
  </div>
</div>

<div id="menu" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Menü"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="cards">
      <button class="card pick" id="save" aria-label="Speichern"></button>
      <button class="card pick" id="sound" aria-label="Ton an oder aus" aria-pressed="true"></button>
      <button class="card pick" id="hand" aria-label="Steuerung spiegeln für Linkshänder" aria-pressed="false"></button>
      <button class="card pick" id="reset" aria-label="Neue Welt"></button>
      <button class="card pick" id="fs" aria-label="Vollbild an oder aus" aria-pressed="false" hidden></button>
      <button class="card pick" id="exp" aria-label="Spielstand als Datei sichern"></button>
      <button class="card pick" id="imp" aria-label="Spielstand aus Datei laden"></button>
    </div>
    <input type="file" id="imp-file" accept=".json,application/json" hidden>
  </div>
</div>
<div id="confirm" class="ov" hidden>
  <div class="sheet" role="alertdialog" aria-label="Neue Welt? Alles Gebaute geht verloren.">
    <div class="ask" id="ask"></div>
    <div class="yn">
      <button class="round big nope" id="no" aria-label="Nein, Welt behalten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
      <button class="round big" id="yes" aria-label="Ja, neue Welt" style="background:var(--good);color:#fff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>
<div id="imp-ok" class="ov" hidden>
  <div class="sheet" role="alertdialog" aria-label="Spielstand laden? Die Welt hier wird ersetzt.">
    <div class="ask" id="imp-ask"></div>
    <div class="yn">
      <button class="round big nope" id="imp-no" aria-label="Nein, Welt behalten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
      <button class="round big" id="imp-yes" aria-label="Ja, Spielstand laden" style="background:var(--good);color:#fff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</div>
<div id="map" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Karte: Reise zu einem entdeckten Land"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><div class="mapv" id="map-v"><canvas id="map-c" aria-label="Karte von allem, was du schon erkundet hast"></canvas></div><div class="cards c4" id="map-cards"></div></div>
</div>
<div id="lab" class="ov" hidden>
  <div class="sheet labs" role="dialog" aria-label="Werkstatt von Professor Zahnrad"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="inv" id="lab-inv"></div>
    <div id="lab-rcp"></div>
    <div class="brain" id="lab-brain"></div>
    <button class="tafb" id="lab-taf" aria-label="Rechentafel und Buchstaben anschauen"></button>
    <button class="tafb" id="lab-finds" aria-label="Funde ansehen"></button>
  </div>
</div>
<div id="tafel" class="ov" hidden>
  <div class="sheet tafs" role="dialog" aria-label="Rechentafel"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="par-tabs" id="taf-tabs"></div>
    <div class="taf" id="taf-grid"></div>
  </div>
</div>
<div id="scope" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Fernrohr"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><svg class="scv" id="scope-v" viewBox="0 0 100 100" aria-hidden="true"></svg><div class="scb" id="scope-b"></div></div>
</div>
<div id="camp" class="ov" hidden>
  <div class="sheet camps" id="camp-s" role="dialog" aria-label="Lagerfeuer">
    <div class="sky" aria-hidden="true"></div>
    <div class="fire" id="camp-f" aria-hidden="true">🔥</div>
    <div class="campz" id="camp-z" aria-hidden="true"></div>
    <div class="campst" id="camp-st"></div>
    <div class="campb"><button class="go" id="camp-go" aria-label="Weiterspielen">▶️</button><button class="rest" id="camp-rest" aria-label="Für heute Schluss">🌙</button></div>
  </div>
</div>
<div id="mine" class="ov" hidden>
  <div class="sheet" role="dialog" aria-label="Aufzug: Station wählen"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><div class="cards c4" id="mine-cards"></div></div>
</div>
<div id="pz" hidden>
  <div class="sheet pzs" id="pz-sheet" role="dialog" aria-label="Rätselmaschine">
    <button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="pztop">
      <button class="round" id="pz-say" aria-label="Aufgabe vorlesen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
      <span class="pzic" id="pz-ic" aria-hidden="true"></span>
      <span class="pzlv" id="pz-lv" aria-hidden="true"></span>
      <button class="round" id="pz-hint" aria-label="Tipp geben">💡</button>
    </div>
    <div id="pz-body"></div>
    <div id="pz-ctl"></div>
  </div>
</div>
<div id="pgate" class="ov" hidden>
  <div class="sheet pgs" role="dialog" aria-label="Für Eltern"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><div id="pg-q"></div><div class="pg-keys" id="pg-keys"></div></div>
</div>
<div id="par" class="ov" hidden>
  <div class="sheet pars" role="dialog" aria-label="Elternansicht: Spielverhalten"><button class="xb" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><h2>Spielverhalten</h2><div id="par-body"></div></div>
</div>
<div id="fade" hidden></div>
<div id="say" aria-live="polite"><span id="say-in"></span></div>
<div id="banner" aria-live="polite"><span id="banner-in"></span></div>

<div id="quiz" hidden>
  <div class="qsheet" role="dialog" aria-label="Lernaufgabe">
    <button id="quiz-x" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    <div class="qtop">
      <button class="round" id="quiz-say" aria-label="Aufgabe vorlesen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></button>
      <span class="cells big" id="quiz-cells"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></span>
      <button class="round go" id="quiz-go" aria-label="Weiterspielen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
      <button class="round" id="quiz-pz" aria-label="Lieber ein Rätsel lösen. Ohne Fehler und Tipp wird der Akku ganz voll."></button>
    </div>
    <div id="q"></div>
    <div id="ans"></div>
  </div>
</div>

<script>
<!-- @js -->
</script>

</body></html>
