<style>
/* Lernschrift Andika (SIL, Open Font License, siehe fonts/OFL.txt) liegt im Repo: offline verfügbar und keine Anfrage an fremde Server. */
@font-face{font-family:'Andika';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format('woff2');}
@font-face{font-family:'Andika';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format('woff2');}
/* Layout: Vollbild-Spielwelt, oben ein Raster aus Bild-Tasten (Fahrzeuge, Malwerkzeuge, Aufgaben), unten zwei Daumenfelder. Keine Schrift, nur Bilder. */
:root{
  --sky:#7fd0e8;
  --ink:#1d2a3a;
  --paper:#fff8e6;
  --ride:#dff3fb;
  --sun:#ffd23f;
  --lava:#ff5a1f;
  --good:#58b548;
  --font-ui:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-learn:'Andika','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-ui);
  overflow:hidden;touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{
  position:fixed;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;
  display:flex;flex-direction:column;gap:9px;pointer-events:none;
}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;pointer-events:auto}
.btn{
  position:relative;min-width:0;height:50px;padding:0;margin:0;cursor:pointer;touch-action:none;
  display:grid;place-items:center;color:var(--ink);
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);
}
.btn.veh{background:var(--ride)}
.btn.gold{background:var(--sun)}
.btn svg{width:30px;height:30px;display:block}
.btn[aria-pressed="true"]{background:var(--sun);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.warn{background:var(--lava)}
.btn:focus-visible,.key:focus-visible,#act:focus-visible,.card:focus-visible,#chip:focus-visible,#panel-x:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
.badge{
  position:absolute;right:-6px;top:-8px;min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;
  border-radius:10px;background:var(--lava);color:var(--paper);border:2px solid var(--ink);
  font:700 12px/16px var(--font-ui);text-align:center;font-variant-numeric:tabular-nums;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16);background:var(--sun)}}
.pulse{animation:pulse .62s ease-in-out 4;z-index:2}

#chip{
  align-self:flex-start;pointer-events:auto;cursor:pointer;touch-action:none;
  display:flex;align-items:center;gap:6px;height:48px;padding:0 12px 0 8px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
}
#chip .tp{width:36px;height:36px}
#chip .ar{width:16px;height:16px}
#chip .tt{width:26px;height:26px}
#chip .bar{display:block;width:64px;height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
#chip .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .25s}
#chip.done{background:var(--sun)}

.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:10px;align-items:flex-end}
.pad.left{left:16px}
.pad.right{right:16px}
body.lefty .pad.left{left:auto;right:16px}
body.lefty .pad.right{right:auto;left:16px;flex-direction:row-reverse}
body.lefty #mark{left:auto;right:15px}
.stack{display:flex;flex-direction:column;gap:10px}
.key{
  width:62px;height:62px;padding:0;border-radius:50%;cursor:pointer;touch-action:none;
  display:grid;place-items:center;color:var(--ink);
  background:rgba(255,248,230,.88);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
}
.key svg{width:30px;height:30px}
.key.down,#act.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--sun)}
#act{
  width:84px;height:62px;padding:0;border-radius:31px;cursor:pointer;touch-action:none;display:grid;place-items:center;
  color:var(--paper);background:var(--lava);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
}
#act svg{width:34px;height:34px}
#mark{position:absolute;bottom:74px;left:15px;width:54px;height:54px;padding:0;border-radius:50%;font-size:26px;cursor:pointer;background:rgba(40,36,70,.9);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#mark.on{background:#ffe27a}
#act.down{color:var(--ink)}

#panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(29,42,58,.55)}
.sheet{
  position:relative;width:100%;max-width:560px;box-sizing:border-box;padding:16px;
  background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);
}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{
  position:relative;min-width:0;padding:8px;margin:0;cursor:pointer;display:grid;place-items:center;
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
}
.card svg.pic{width:72px;height:72px;max-width:100%}
.card .got{position:absolute;right:-7px;top:-9px;width:30px;height:30px}
.card.won{background:#f1f9e4}
#panel-x{
  position:absolute;right:-8px;top:-12px;width:42px;height:42px;padding:0;border-radius:50%;cursor:pointer;z-index:2;
  display:grid;place-items:center;background:var(--lava);color:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
#panel-x svg{width:20px;height:20px}

/* Lern-Akku, Schlösser und Lernaufgabe */
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#batt{
  pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:5px;height:48px;padding:0 10px 0 6px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
}
#batt svg{width:24px;height:24px}
.cells{display:flex;gap:3px}
.cells i{position:relative;display:block;width:11px;height:22px;box-sizing:border-box;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden}
.cells i b{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--good)}
.cells.big{gap:5px}
.cells.big i{width:26px;height:36px;border-width:3px;border-radius:7px}
.lock{position:absolute;left:-6px;top:-8px;display:none}
.btn .lock svg{width:19px;height:19px}
.locked .lock{display:block}
.locked .cool>svg{opacity:.4;filter:grayscale(1)}
#quiz{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:16px;background:rgba(29,42,58,.6)}
.qsheet{
  position:relative;width:100%;max-width:440px;box-sizing:border-box;padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);
}
.qtop{display:flex;align-items:center;gap:12px}
.round{
  width:48px;height:48px;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
.round svg{width:26px;height:26px}
.round.go{background:var(--good);color:#fff}
.round:focus-visible,.opt:focus-visible,#batt:focus-visible,#quiz-x:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
#quiz-x{
  position:absolute;right:-8px;top:-12px;width:42px;height:42px;padding:0;border-radius:50%;cursor:pointer;z-index:2;
  display:grid;place-items:center;background:var(--lava);color:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
#quiz-x svg{width:20px;height:20px}
#q{min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--font-learn);color:var(--ink)}
.eq{font-size:46px;font-weight:700;line-height:1.15;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq.big{font-size:64px}
.hole{display:inline-block;min-width:.9em;padding:0 .1em;border:3px dashed var(--ink);border-radius:10px;color:var(--lava);text-align:center}
.objs{display:grid;grid-template-columns:repeat(5,36px);gap:4px}
.objs svg{width:36px;height:36px}
.zf{display:inline-grid;grid-template-columns:repeat(5,34px);gap:5px;padding:7px;border:3px solid var(--ink);border-radius:10px;background:#fff}
.zf i{width:34px;height:34px;border-radius:50%;border:2.5px solid #c9ced6;box-sizing:border-box}
.zf i.on{background:#e2423c;border-color:var(--ink)}
.zf.z20{grid-template-columns:repeat(10,22px);gap:3px;padding:5px}
.zf.z20 i{width:22px;height:22px;border-width:2px}
.zf.z20 i:nth-child(5n){margin-right:4px}
.zf i.on2{background:#2f6fd6;border-color:var(--ink)}
.zf i.off{background:#e2423c;border-color:var(--ink);opacity:.35;position:relative}
.zf i.off::after{content:'';position:absolute;left:-2px;right:-2px;top:8px;height:3px;background:var(--ink);transform:rotate(-45deg)}
.zf.blink{animation:zfhide .2s 1.5s forwards}
@keyframes zfhide{to{opacity:0;visibility:hidden}}
.dots{font-size:22px;line-height:1;letter-spacing:3px}
.nbar{font-size:34px;line-height:1}
.haus{display:inline-grid;grid-template-columns:1fr 1fr;width:170px;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.haus .roof{grid-column:1/3;height:64px;line-height:78px;text-align:center;background:#e85d4a;color:#fff;clip-path:polygon(50% 0,100% 100%,0 100%)}
.haus span.rm{display:grid;place-items:center;height:64px;border:3px solid var(--ink);background:#fff8e6}
.haus span.rm+span.rm{border-left:0}
.haus .hole{margin:0}
.da{color:#2f6fd6}
.db{color:#ff8a1f}
.dx{color:#c4bca6}
.qpic{width:96px;height:96px}
.syl{font:700 30px/1.2 var(--font-learn);letter-spacing:.02em}
.syl .s0{color:#2f6fd6}.syl .s1{color:#e2423c}
.opt.pic svg{width:58px;height:58px}
.opt.clap{font-size:24px;white-space:nowrap;letter-spacing:-3px;padding:0 2px}
#ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{
  min-width:0;height:64px;padding:0;margin:0;cursor:pointer;font:700 32px/1 var(--font-learn);color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
}
.opt.word{font-size:23px}
.opt.ok{background:var(--good);color:#fff}
.opt.no{background:#e9e4d6;color:#a39c8a;box-shadow:none;transform:translateY(4px)}
/* Richtig/falsch nicht nur über Farbe (Rot-Grün-Schwäche betrifft etwa jeden zwölften Jungen): Haken und Kreuz als Zeichen. */
.opt.ok,.opt.no{position:relative}
.opt.ok::after,.opt.no::after{position:absolute;right:-8px;top:-10px;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);font:900 16px/21px var(--font-ui);text-align:center;color:#fff}
.opt.ok::after{content:'✓';background:var(--good)}
.opt.no::after{content:'✗';background:#d64545}
#ans.kp{gap:8px}
.opt.key{height:56px}
.opt.key svg{width:30px;height:30px;vertical-align:middle}
.opt.key.go{background:var(--good);color:#fff}
.opt.key.del{background:#f1ece0}
.opt.key:disabled{opacity:.55}
.hole.ok{border-color:var(--good);color:var(--good)}
.hole.sol{border-style:solid;border-color:#2f6fd6;color:#2f6fd6}

/* Auswahl-Fenster für Fahrzeuge, Werkzeuge und Funde */
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(29,42,58,.55)}
.xb{
  position:absolute;right:-8px;top:-12px;width:42px;height:42px;padding:0;border-radius:50%;cursor:pointer;z-index:2;
  display:grid;place-items:center;background:var(--lava);color:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
.xb svg{width:20px;height:20px;pointer-events:none}
.xb:focus-visible,.album button:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
.card.pick{padding:10px 8px}
.card.pick>svg{width:54px;height:54px;max-width:100%}
.card[aria-pressed="true"]{background:var(--sun)}
.card .lock{left:-7px;top:-9px}
.card .lock svg{width:24px;height:24px}
.btn.ok{background:var(--good)}
.loot{display:flex;gap:18px;justify-content:center;align-items:center;margin-bottom:12px;font:700 20px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.loot span{display:flex;align-items:center;gap:6px}
.loot svg{width:26px;height:26px}
.album{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.album button{
  min-width:0;aspect-ratio:1;padding:0;margin:0;cursor:pointer;font-size:25px;line-height:1;
  background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink);
}
.album button.q{background:#e9e4d6;color:#a39c8a;font:700 20px/1 var(--font-ui);cursor:default}
@keyframes near{0%,100%{transform:scale(1)}50%{transform:scale(1.14);background:#bfeaf7}}
.near{animation:near 1.3s ease-in-out infinite}
.hot{animation:near .42s ease-in-out infinite}

/* Auftrag, Banner, Menü */
#quest{
  pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
  font:700 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;
}
#quest svg{width:26px;height:26px}
#quest .bar{display:block;width:54px;height:12px;box-sizing:border-box;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
#quest .bar i{display:block;height:100%;width:0;background:#3aa0e8;transition:width .25s}
#quest.done{background:var(--sun)}
#quest:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
#mis{pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:2px;padding:0 10px;margin:0;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 #e63946;color:var(--ink);font:700 22px/1 var(--font-ui)}
#mis:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
#mis .st{font-size:18px}
#batt,#mkt,#chip,#quest,#mis{height:44px}
@keyframes low{50%{background:#ffb09a}}
#batt.low{animation:low .6s ease-in-out infinite}
@keyframes bump{40%{transform:scale(1.1)}}
.bump{animation:bump .25s ease-out}
#banner{position:fixed;left:16px;right:16px;top:29%;z-index:7;display:flex;justify-content:center;pointer-events:none}
#banner span{
  display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:24px;white-space:nowrap;
  background:var(--sun);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:var(--ink);
  font:700 26px/1 var(--font-ui);font-variant-numeric:tabular-nums;
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .28s cubic-bezier(.3,1.6,.5,1);
}
#banner.show span{opacity:1;transform:none}
#banner svg{width:28px;height:28px}
.card.ok{background:var(--good)}
.card.warn{background:var(--lava)}
.ask{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:16px}
.ask svg{width:60px;height:60px}
.yn{display:flex;justify-content:center;gap:30px}
.round.big{width:72px;height:72px}
.round.big svg{width:38px;height:38px}
.round.nope{background:var(--lava);color:#fff}
.round.go{animation:near 1.3s ease-in-out infinite}

/* Held, Verbesserungen und Markt */
#mkt{
  pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:4px;height:48px;padding:0 11px 0 7px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
  font:700 15px/1 var(--font-ui);font-variant-numeric:tabular-nums;
}
#mkt svg{width:18px;height:18px}
#mkt:focus-visible,.shopc:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
.lv{
  display:grid;place-items:center;min-width:26px;height:26px;padding:0 4px;box-sizing:border-box;border-radius:13px;
  background:#7b4fd6;color:#fff;border:2px solid var(--ink);font:700 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;
}
.xpb{display:block;width:26px;height:9px;box-sizing:border-box;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;margin-right:3px}
.xpb i{display:block;height:100%;width:0;background:#7b4fd6}
.xpb.wide{width:84px;height:13px;border-radius:7px}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shopc{
  position:relative;min-width:0;padding:6px 2px 6px;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);color:var(--ink);
  font:700 12px/1.1 var(--font-learn);
}
.shopc .em{font-size:29px;line-height:1.1}
.shopc .pips{font-size:11px;line-height:1;letter-spacing:2px;color:#7b4fd6;min-height:11px}
.shopc .pr{display:flex;align-items:center;gap:2px;font:700 13px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.shopc .pr svg{width:14px;height:14px}
.shopc.poor .pr{color:#b0392b}
.shopc.poor,.shopc.lvl{background:#f1ede2}
.shopc.lvl .em{filter:grayscale(1);opacity:.5}
.shopc.max,.shopc.own{background:#f1f9e4}
.shopc.on{background:var(--sun)}
.shopc .yes{color:#2f8f4a;font-size:15px}

/* Große Welt: Karte zum Reisen und Belohnungen für goldene Eier */
.card.place{padding:8px 4px;font-size:34px;line-height:1.25}
.card.place small{position:absolute;right:7px;bottom:3px;font:700 12px/1 var(--font-ui)}
.card.place.cur{background:var(--sun)}
.card.place.shut{background:#e9e4d6}
.eggs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:2.5px dashed var(--ink)}
.eggn{display:flex;align-items:center;gap:4px;margin-right:4px;font:700 20px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.eggn svg{width:26px;height:26px}
.eggs button{width:40px;height:40px;padding:0;margin:0;cursor:pointer;font-size:23px;line-height:1;background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink)}
.eggs button.q{background:#e9e4d6;color:#a39c8a;font:700 15px/1 var(--font-ui)}
.eggs button.on{background:var(--sun)}
.eggs button:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
@media (max-width:360px){
  .btn svg{width:24px;height:24px}
}
/* Tiefe und Höhe: Werkstatt, Aufzug und Rätselmaschinen */

.tafb{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;padding:8px 12px;width:100%;background:#eef4ff;border:2.5px solid var(--ink);border-radius:14px;color:var(--ink);font:700 20px/1 var(--font-learn);cursor:pointer}
.tafs{max-width:520px;max-height:88vh;overflow:auto}
#map .sheet{min-width:0}
.mapv{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;margin:4px 0 10px;border:2.5px solid var(--ink);border-radius:12px;background:#151522;-webkit-overflow-scrolling:touch}
.mapv canvas{display:block}
#scope .sheet{background:#0d1030;color:#fff6e0;text-align:center;max-width:420px}
.scv{display:block;width:min(300px,70vw);height:min(300px,70vw);border-radius:50%;border:6px solid var(--ink);background:radial-gradient(#1a2060,#070a20);margin:6px auto;font-family:var(--font-learn)}
.scb{display:flex;gap:12px;justify-content:center;margin-top:12px;min-height:72px}

#camp{background:rgba(8,10,30,.86)}

.camps .sky{height:28px;background:radial-gradient(circle,#fff 1px,transparent 2px) 0 0/34px 22px;opacity:.6}

.campst span{display:flex;align-items:center;gap:6px;padding:6px 12px;border:2.5px solid #fff6e0;border-radius:14px;font:700 22px/1 var(--font-learn)}

.campb{display:flex;gap:14px;justify-content:center;margin-top:14px}

.inv button:focus-visible,.chipm:focus-visible,.mk:focus-visible,.rc .tl:focus-visible,.brain button:focus-visible{outline:3px solid var(--lava);outline-offset:2px}

#pz{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:12px;background:rgba(29,42,58,.62)}

.tok{width:36px;height:36px;display:block}

.pzt,.pzhole{width:42px;height:42px;box-sizing:border-box;display:grid;place-items:center}

.pzn{display:grid;place-items:center;width:38px;height:38px;box-sizing:border-box;border-radius:10px;background:#fff;border:2.5px solid var(--ink);font:700 21px/1 var(--font-learn);font-variant-numeric:tabular-nums;color:var(--ink)}

.pzg{display:grid;gap:4px}
.pzc{width:var(--cs);height:var(--cs);padding:0;margin:0;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:9px;background:#fff;display:grid;place-items:center;font-size:calc(var(--cs)*.56);line-height:1;color:var(--ink);cursor:pointer;overflow:hidden}

.pzdot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle,#fffbe0 0,#ffd23f 38%,rgba(255,210,63,.25) 62%,rgba(255,210,63,0) 72%);color:var(--ink);font:700 15px/44px var(--font-learn)}

.pzdot.no{background:radial-gradient(circle,#ffd0d0 0,#e63946 40%,rgba(230,57,70,0) 70%)}
.pzshape{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;animation:near .6s ease-in-out 2}

.pzc.wall{background:#5b5560;border-color:#3a3438}

.slot{position:relative;width:34px;height:34px;box-sizing:border-box;border:2.5px dashed #a39c8a;border-radius:9px;display:grid;place-items:center;font-size:18px;line-height:1}

.slot b{position:absolute;right:-6px;bottom:-7px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--paper);font:700 11px/17px var(--font-ui);text-align:center}
.rbctl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.dpad{display:grid;grid-template-columns:repeat(3,50px);gap:5px}

  for(let i=1;i<pts.length;i++){
    let ax=pts[i-1][0], ay=pts[i-1][1]; const bx=pts[i][0], by=pts[i][1];
    let seg=Math.hypot(bx-ax,by-ay);

      seg=Math.hypot(bx-ax,by-ay); acc=0;
    }
    acc+=seg;
  }
  if(R.length<16) return null;
  let minX=1e9,maxX=-1e9;
  for(const p of R){ if(p[0]<minX)minX=p[0]; if(p[0]>maxX)maxX=p[0]; }
  return {pts:R,len:(R.length-1)*8,minX:minX,maxX:maxX,user:!!user,

function take(i){

  if(m<4||m===BED||m===CORE) return 0;
  if(m===SHELL&&!shellOk(i)) return 0;
  grid[i]=0;

    const r=colTop(c,cy)-1;

function mover(dt,hw,h,step,half){

  if(P.vx!==0){

function updCar(dt,ix,u,d){

  P.ang+=(ta-P.ang)*Math.min(1,dt*10);
}
/* Baufahrzeuge fahren sich nie fest: an einer Wand klettern sie hoch; ist darüber kein Platz, räumen sie sich den Weg frei. */
function drive(dt,ix,sp,hw,h,half,vmax){
  if(ix) P.face=ix;
  if(P.climb>0){ P.climb-=dt; P.vx=P.face*70; P.vy=0; }
  else{
    if(P.on) P.vx+=(ix*sp*(1+.2*hero.up.motor)-P.vx)*Math.min(1,dt*5); else P.vx+=(ix*70-P.vx)*Math.min(1,dt*2);
    P.vy=Math.min(P.vy+grav()*dt,vmax||800);
  }
  if(cellAt(P.x,P.y-10)===WATER){ P.vx-=P.vx*Math.min(1,dt*2); P.soot=0; }
  const pv=P.vy;
  if(mover(dt,hw,h,32,half)){
    if(ix){
      const top=P.y-h-20;
      if(!solidW(P.x,top)&&!solidW(P.x-15,top)&&!solidW(P.x+15,top)){ P.y-=150*dt; P.on=false; P.climb=.25; }
      else bulldoze(ix);
    }else P.vx=0;
  }
  if(P.on){ if(P.landed&&pv>300) dust(P.x,P.y); P.vy=P.gs*P.vx; P.climb=0; }
  P.ang+=((P.climb>0?-P.face*.6:(P.on?Math.atan(P.gs):0))-P.ang)*Math.min(1,dt*10);
}
function updBagger(dt,ix,u,d){
  P.arm=clamp(P.arm+(d-u)*1.7*dt,-.95,1.25);
  drive(dt,ix,110,22,28,15);
  if(keys.a){ P.digT-=dt; if(P.digT<=0){ baggerAct(); P.digT=.17/(1+.35*hero.up.dig); } }
}
function updLoader(dt,ix,u,d){
  P.lift=clamp(P.lift+(u-d)*90*dt,0,64);
  drive(dt,ix,170,26,30,17);
  if(keys.a){ P.digT-=dt; if(P.digT<=0){ loaderAct(); P.digT=.17/(1+.35*hero.up.dig); } }
}
function updDumper(dt,ix,u,d){
  drive(dt,ix,230,30,32,20);
  P.bed=Math.max(0,P.bed-dt*1.6);
  if(keys.a){ P.digT-=dt; if(P.digT<=0){ dumperAct(); P.digT=.14; } }
}
/* Tunnelbohrmaschine: bohrt beim Fahren ein rundes Loch in Fahrtrichtung, auch durch Fels. ▲/▼ kippt den Bohrkopf. */
function updTbm(dt,ix,u,d){
  P.da=clamp(P.da+(d-u)*1.3*dt,-1.1,1.25);
  const go=ix||(keys.a?P.face:0);
  if(go){
    P.face=go;
    const hd=drillHead();
    let cutN=bore(hd[0],hd[1],27);
    if(P.da>.2) cutN+=bore(P.x+go*14,P.y-27,27);
    if(cutN){
      shake=Math.max(shake,.04); sfx('dig');
      if(Math.random()<dt*16) spawn(3,hd[0]+(Math.random()-.5)*30,hd[1]+(Math.random()-.5)*40,-go*(40+Math.random()*120),-40-Math.random()*90,.6,3+Math.random()*3);
    }
    if(chest&&!chest.open&&Math.hypot(hd[0]-chest.x,hd[1]-chest.y)<46) chest.open=true;
  }
  drive(dt,go,P.da>0?85*Math.max(.3,Math.cos(P.da)):95,24,46,14,170+60*hero.up.dig);
}
/* Rakete: ▲ zündet das Triebwerk, ◀ ▶ steuert in der Luft. Ohne Schub sinkt sie langsam. */
function updRocket(dt,ix,u,d){
  if(u){
    if(P.on){ P.on=false; P.y-=3; shake=Math.max(shake,.3); smoke(P.x,P.y,8); }
    P.vy+=(-800*(1+.2*hero.up.jet)-P.vy)*Math.min(1,dt*1.5);
    if(Math.random()<dt*50) spawn(1,P.x+(Math.random()-.5)*8,P.y+6,(Math.random()-.5)*50,160+Math.random()*120,.35,7);
  }
  else P.vy=Math.min(P.vy+grav()*.8*dt,d?720:400);
  if(P.on) P.vx-=P.vx*Math.min(1,dt*8);
  else{ P.vx+=(ix*230-P.vx)*Math.min(1,dt*2.5); if(ix) P.face=ix; }
  const pv=P.vy;
  if(mover(dt,13,56,26,9)) P.vx*=-.3;
  if(P.on){ if(P.landed&&pv>200) dust(P.x,P.y); P.vy=0; }
  P.ang+=((P.on?0:clamp(P.vx/230,-1,1)*.35)-P.ang)*Math.min(1,dt*6);
}
function updPlane(dt,ix,u,d){
  if(ix) P.face=ix;
  if(P.on){
    P.vx+=(ix*260-P.vx)*Math.min(1,dt*(ix?1.3:(P.y<-3000?4:.9)));
    if(u&&Math.abs(P.vx)<130) P.vx+=P.face*320*dt;
    P.upT=u?(P.upT||0)+dt:0;
    P.vy=Math.min(P.vy+grav()*dt,800);
    if(mover(dt,30,28,26,18)) P.vx=0;
    if(P.on){
      P.vy=P.gs*P.vx; P.ang=Math.atan(P.gs);
      /* Abheben geht auch ohne Anlauf, damit das Flugzeug aus jedem Loch herauskommt. */
      if((u&&Math.abs(P.vx)>120)||Math.abs(P.vx)>235||P.upT>.45){ P.on=false; P.vy=u?-130:-60; P.y-=3; P.upT=0; }
    }
  }else{
    P.vx+=(P.face*250*(1+.15*hero.up.jet)-P.vx)*Math.min(1,dt*2);
    P.vy+=((d-u)*(P.y<-1200?430:190)*(1+.2*hero.up.jet)-P.vy)*Math.min(1,dt*3);
    if(P.y<-1200&&Math.random()<dt*40) spawn(1,P.x-P.face*36,P.y-16,-P.face*90,(Math.random()-.5)*30,.3,6);
    if(mover(dt,30,28,26,18)){ P.face=-P.face; P.vx=P.face*80; }
    if(P.on){ P.vy=0; dust(P.x,P.y); }
  }
}
function updCoaster(dt,ix){
  const T=P.track;
  if(T.lift){ liftRide(dt); return; }
  let q=trackAt(T,P.s);
  P.v+=G*.9*q.ty*dt+ix*T.dir*220*dt;
  P.v-=P.v*.08*dt;
  if(P.v<90) P.v+=(90-P.v)*Math.min(1,dt*4);
  if(P.v>1000) P.v=1000;
  P.s+=P.v*dt;
  q=trackAt(T,P.s);
  P.x=q.x; P.y=q.y; P.vx=q.tx*P.v; P.vy=q.ty*P.v; P.ang=Math.atan2(q.ty,q.tx); P.face=T.dir;
  if(P.s>=T.len){
    qEvent('ride',1);
    if(T.user&&task&&task.id==='park') task.data.rode=true;
    P.vy-=90; P.mode='walk'; P.on=false; P.air=.2; P.chute=false;
    syncUI();
  }
}
function settle(o,dt){
  const f=floorAt(o.x,o.y,26);
  if(o.y<f-1){ o.vy+=G*dt; if(o===parked.balloon&&o.vy>70) o.vy=70; o.y=Math.min(f,o.y+o.vy*dt); }
  else{ o.y=f; o.vy=0; o.ang+=(Math.atan(clamp((floorAt(o.x+16,o.y,26)-floorAt(o.x-16,o.y,26))/32,-1.3,1.3))-o.ang)*Math.min(1,dt*10); }
}

function update(dt){
  time+=dt;
  const ix=(keys.r?1:0)-(keys.l?1:0), u=keys.u?1:0, d=keys.d?1:0;
  if(P.hurt>0)P.hurt-=dt; if(P.soot>0)P.soot-=dt; if(P.frost>0)P.frost-=dt; if(P.turbo>0)P.turbo-=dt; if(shake>0)shake-=dt;
  popT-=dt;
  if(popT<=0&&(popG||popM)){
    if(popG) spawn(9,P.x-12,P.y-60,0,-55,.9,17,'+'+popG,'#ffd23f');
    if(popM) spawn(9,P.x+16,P.y-74,0,-55,.9,17,'+'+popM,'#7fe3f0');
    popG=0; popM=0; popT=.4;
  }
  if(P.swing>0) P.swing=Math.max(0,P.swing-dt*5);
  if(keys.a&&DIGT[tool]&&P.mode==='walk'&&!paused&&!nearBoard()&&!zipNear()&&!deepIcon()) handDig();
  if(P.zip) zipRide(dt);
  else if(P.mode==='walk') updWalk(dt,ix,u,d);
  else if(P.mode==='car') updCar(dt,ix,u,d);
  else if(P.mode==='plane') updPlane(dt,ix,u,d);
  else if(P.mode==='bagger') updBagger(dt,ix,u,d);
  else if(P.mode==='loader') updLoader(dt,ix,u,d);
  else if(P.mode==='dumper') updDumper(dt,ix,u,d);
  else if(P.mode==='tbm') updTbm(dt,ix,u,d);
  else if(P.mode==='rocket') updRocket(dt,ix,u,d);
  else if(P.mode==='ski') updSki(dt,ix,u,d);
  else if(P.mode==='dragon') updDragon(dt,ix,u,d);
  else if(P.mode==='sub') updSub(dt,ix,u,d);
  else if(P.mode==='balloon') updBalloon(dt,ix,u,d);
  else if(P.mode==='heli') updHeli(dt,ix,u,d);
  else if(P.mode==='boat') updBoat(dt,ix,u,d);
  else if(P.mode==='bug') updBug(dt,ix,u,d);
  else updCoaster(dt,ix);

  if(P.mode!=='coaster'&&P.mode!=='dragon'&&P.hurt<=0&&FX.star<=0){
    let hot=burns(P.x,P.y-4)||burns(P.x,P.y-16);
    if(P.mode!=='walk'&&P.mode!=='ski'&&P.mode!=='plane'&&P.mode!=='rocket') hot=hot||burns(P.x-20,P.y-5)||burns(P.x+20,P.y-5);
    if(P.mode==='plane') hot=hot||burns(P.x+24*P.face,P.y-10);
    if(cellAt(P.x,P.y+3)===CORE) qEvent('core',1);
    if(hot||(hero.up.heat<3&&cellAt(P.x,P.y+3)===CORE)) burn();
  }
  if(P.soot>0&&Math.random()<dt*8) spawn(0,P.x,P.y-30,(Math.random()-.5)*20,-40,.7,4);
  if(chest&&!chest.open&&Math.hypot(P.x-chest.x,P.y-12-chest.y)<34) chest.open=true;

  for(let i=bombs.length-1;i>=0;i--){
    const bm=bombs[i]; bm.t-=dt;
    if(!solidW(bm.x,bm.y+7)){ bm.vy=Math.min(bm.vy+G*dt,560); bm.y+=bm.vy*dt; } else bm.vy=0;
    if(bm.t<=0){ bombs.splice(i,1); blast(bm.x,bm.y); }
  }
  if(hero.pet){ pet.x+=(P.x-P.face*30-pet.x)*Math.min(1,dt*4); pet.y+=(P.y-16-pet.y)*Math.min(1,dt*5); }
  for(const k in parked) if(parked[k]&&!(k===heliLoad&&P.mode==='heli')) settle(parked[k],dt);
  if(parked.rocket) parked.rocket.ang=0;
  if(ghost){
    ghost.vy+=150*dt; ghost.x+=ghost.vx*dt; ghost.y+=ghost.vy*dt;
    if(ghost.x<50||ghost.x>WORLD_W-50) ghost.vx*=-1;
    if(Math.random()<dt*18) spawn(0,ghost.x,ghost.y-14,0,-10,.9,5);
    if(solidW(ghost.x,ghost.y)||solidW(ghost.x+(ghost.vx>0?30:-30),ghost.y-14)||hotAt(ghost.x,ghost.y-8)){ explode(ghost.x,ghost.y); ghost=null; }
  }
  for(const tr of trees){
    if(tr.state!==1) continue;
    tr.t-=dt;
    if(Math.random()<dt*22) spawn(1,tr.x+(Math.random()-.5)*34*tr.s,tr.gy-tr.h+(Math.random()-.3)*30,(Math.random()-.5)*20,-50-Math.random()*50,.5+Math.random()*.4,6+Math.random()*5);
    if(Math.random()<dt*5) spawn(0,tr.x,tr.gy-tr.h-20,(Math.random()-.5)*20,-50,1.2,7);
    if(tr.t<=0) tr.state=2;
  }
  if(Math.abs(cam.x-VOLC)<1500){
    const cy=ground(VOLC)-30, live=cellAt(VOLC,cy+8)===LAVA||cellAt(VOLC-30,cy+8)===LAVA||cellAt(VOLC+30,cy+8)===LAVA;
    if(live&&Math.random()<dt*5) spawn(0,VOLC+(Math.random()-.5)*90,cy,(Math.random()-.5)*20,-45-Math.random()*30,2.2,9+Math.random()*8);
    volT-=dt;
    if(volT<=0){
      volT=6+Math.random()*6;
      if(live) for(let i=0;i<10;i++) spawn(4,VOLC+(Math.random()-.5)*60,cy,(Math.random()-.5)*340,-380-Math.random()*220,2.4,4+Math.random()*3);
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.type===0||p.type===7){ p.vy-=20*dt; p.size+=9*dt; }
    else if(p.type===1) p.vy-=70*dt;
    else if(p.type===2) p.vy-=10*dt;
    else if(p.type===6){ p.vy+=G*.35*dt; p.vx-=p.vx*dt*1.5; }
    else if(p.type<8) p.vy+=G*.6*dt;
    else if(p.type===10) p.vy+=G*.45*dt;
    else if(p.type===12){ p.vy-=18*dt; p.size+=5*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type===4&&p.vy>0&&solidW(p.x,p.y)) p.life=0;
  }
  const vw=W/S, vh=H/S;
  /* Beim Schienenmalen schiebt der Finger am Bildrand die Kamera weiter, so lassen sich lange und hohe Bahnen in einem Zug malen. */
  const sp=strokeId!==null&&stroke?pointers.get(strokeId):null;
  if(sp){
    const v=330*dt, topS=Math.min(H*.4,150);
    if(sp.x<64) pan.x-=v; else if(sp.x>W-64) pan.x+=v;
    if(sp.y<topS+56) pan.y-=v; else if(sp.y>H-190) pan.y+=v;
    pan.x=clamp(pan.x,-3000,3000); pan.y=clamp(pan.y,-5200,1500);
    const w=toWorld(sp.x,sp.y), l=stroke[stroke.length-1];
    if(stroke.length<900&&Math.hypot(w[0]-l[0],w[1]-l[1])>10) stroke.push(w);
  }else{ pan.x-=pan.x*Math.min(1,dt*2.5); pan.y-=pan.y*Math.min(1,dt*2.5); }
  const tx=P.x+clamp(P.vx*.3,-110,110)+pan.x, ty=P.y-vh*.08-20+pan.y;
  cam.x+=(tx-cam.x)*Math.min(1,dt*4); cam.y+=(ty-cam.y)*Math.min(1,dt*5);
  if(!realm&&vw<WORLD_W) cam.x=clamp(cam.x,vw/2,WORLD_W-vw/2);
}

/* ---------- Malen mit dem Finger ---------- */
const pointers=new Map();
function toWorld(sx,sy){ return [cam.x+(sx-W/2)/S, cam.y+(sy-H/2)/S]; }
function disc(cx,cy,r,m){
  const n=Math.ceil(r);
  for(let dy=-n;dy<=n;dy++) for(let dx=-n;dx<=n;dx++){
    if(dx*dx+dy*dy>r*r) continue;
    const x=cx+dx, y=cy+dy;
    if(inGrid(x,y)&&grid[y*GX+x]<4){ grid[y*GX+x]=m; life[y*GX+x]=0; }
  }
}
function erase(wx,wy){
  const cx=Math.floor(wx/CELL), cy=Math.floor((wy-TOP)/CELL);
  for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
    if(dx*dx+dy*dy>18) continue;
    const x=cx+dx, y=cy+dy;
    if(!inGrid(x,y)) continue;
    const m=grid[y*GX+x];
    if(m===LAVA||m===FIRE||m===WATER||m===ICE||m===WOOD||m===SNOW){ grid[y*GX+x]=0; life[y*GX+x]=0; }
  }
  props=props.filter(function(o){ return Math.abs(o.x-wx)>30||wy>o.y+10||wy<o.y-110; });
  for(let k=tracks.length-1;k>=0;k--){
    const T=tracks[k];
    if(wx<T.minX-20||wx>T.maxX+20) continue;
    for(let i=0;i<T.pts.length;i+=2){
      const p=T.pts[i];
      if(Math.abs(p[0]-wx)<18&&Math.abs(p[1]-wy)<18){
        if(P.mode==='coaster'&&P.track===T) setMode('walk');
        tracks.splice(k,1); break;
      }
    }
  }
}
function paintAt(wx,wy){
  const cx=Math.floor(wx/CELL), cy=Math.floor((wy-TOP)/CELL);
  if(tool==='lava'||tool==='water'){
    const t=tool==='lava'?LAVA:WATER;
    if(t===LAVA?lavaCount>=MAX_LAVA:waterCount>=MAX_WATER){ pulse('tool-erase'); return; }
    putUp(cx,cy,t);putUp(cx+1,cy,t);putUp(cx-1,cy,t);putUp(cx,cy-1,t);putUp(cx,cy+1,t);
    if(t===WATER){ putUp(cx+1,cy-1,t); putUp(cx-1,cy-1,t); }
  }
  else if(tool==='fire'){ putUp(cx,cy,FIRE); putUp(cx+1,cy,FIRE); }
  else if(tool==='earth') disc(cx,cy,1.7,EARTH);
  else if(tool==='ice') disc(cx,cy,2.3,ICE);
  else if(tool==='snow') disc(cx,cy,2.3,SNOW);
  else if(tool==='blocks') fillBlock(cx>>2,cy>>2);
  else if(tool==='erase') erase(wx,wy);
}
function paintStep(){
  if(!tool||tool==='track'||tool==='rope') return;
  if(tool==='bow'){ pointers.forEach(function(p){ if(!p.has){ p.has=true; const w=toWorld(p.x,p.y); shoot(w[0],w[1]); } }); return; }
  if(HANDT[tool]){ pointers.forEach(function(p){ const w=toWorld(p.x,p.y); if(Math.hypot(w[0]-P.x,w[1]-P.y+20)<95) handDig(w[0],w[1]); }); return; }
  pointers.forEach(function(p){
    const w=toWorld(p.x,p.y);
    if(tool==='tnt'){ if(!p.has){ p.has=true; dropBomb(w[0],w[1]); } return; }
    if(tool==='ball'||tool==='fw'){ if(!p.has||time-p.bt>(tool==='ball'?.28:.4)){ p.has=true; p.bt=time; if(tool==='ball') throwBall(w[0],w[1]); else firework(w[0],w[1]); } return; }
    if(tool==='man'){ if(!p.has){ p.has=true; addMan(w[0]); } return; }
    if(p.has){
      const dist=Math.hypot(w[0]-p.lx,w[1]-p.ly), n=Math.min(18,Math.max(1,Math.ceil(dist/CELL)));
      for(let k=1;k<=n;k++) paintAt(p.lx+(w[0]-p.lx)*k/n,p.ly+(w[1]-p.ly)*k/n);
    }else paintAt(w[0],w[1]);
    p.lx=w[0]; p.ly=w[1]; p.has=true;
  });
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,has:false,lx:0,ly:0});
  if(!tool) tapWorld(e.clientX,e.clientY);
  if(tool==='rope') pointers.get(e.pointerId).rs=toWorld(e.clientX,e.clientY);
  if(tool==='track'&&strokeId===null){
    const w=toWorld(e.clientX,e.clientY);
    strokeId=e.pointerId; strokeExt=null; stroke=[w];
    for(const T of tracks){
      const a=T.pts[0], b=T.pts[T.pts.length-1];
      if(Math.hypot(w[0]-b[0],w[1]-b[1])<46){ strokeExt={T:T,end:true}; stroke=[[b[0],b[1]]]; break; }
      if(Math.hypot(w[0]-a[0],w[1]-a[1])<46){ strokeExt={T:T,end:false}; stroke=[[a[0],a[1]]]; break; }
    }
  }
});
cv.addEventListener('pointermove',function(e){
  const p=pointers.get(e.pointerId); if(!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if(e.pointerId===strokeId&&stroke&&stroke.length<900){
    const w=toWorld(p.x,p.y), l=stroke[stroke.length-1];
    if(Math.hypot(w[0]-l[0],w[1]-l[1])>10) stroke.push(w);
  }
});
function endPointer(e){
  const pp=pointers.get(e.pointerId);
  if(pp&&pp.rs&&tool==='rope'){ const w=toWorld(pp.x,pp.y); zipAdd(pp.rs[0],pp.rs[1],w[0],w[1]); }
  pointers.delete(e.pointerId);
  if(e.pointerId===strokeId){
    const ex=strokeExt, k=ex?tracks.indexOf(ex.T):-1;
    if(ex&&k>=0){
      if(stroke&&stroke.length>2){
        const add=stroke.slice(1);
        let raw=ex.end?ex.T.raw.concat(add):add.reverse().concat(ex.T.raw);
        if(raw.length>2600) raw=ex.end?raw.slice(raw.length-2600):raw.slice(0,2600);
        const N=makeTrack(raw,true);
        if(N){
          if(P.mode==='coaster'&&P.track===ex.T){ if(!ex.end) P.s+=N.len-ex.T.len; P.track=N; }
          tracks[k]=N; pulse('mode-coaster');
        }
      }
    }else{
      const T=makeTrack(stroke,true);
      if(T){ tracks.push(T); if(tracks.length>12) tracks.shift(); pulse('mode-coaster'); }
      else if(stroke&&stroke.length>1) pulse('tool-track');
    }
    stroke=null; strokeId=null; strokeExt=null;
  }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);

/* ---------- Ton und Sprache ---------- */
let AC=null, talkLock=0, tapT=0;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ AC=null; } }
  if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(_){} }
}
function jingle(){
  if(!AC||muted||fxOff) return;
  try{
    const t=AC.currentTime;
    [523,659,784,1047].forEach(function(f,i){

    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);

function noise(dur,freq,vol){

    if(!noiseBuf){ noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.6),AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }

    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);

  }catch(_){}
}

function onSnow(){ const a=cellAt(P.x,P.y+3), b=cellAt(P.x,P.y+9); return a===SNOW||a===ICE||b===SNOW||b===ICE; }
/* ---------- Ski: ◀ ▶ anschieben, ▼ bremsen, ▲ Düse, rote Taste springt und macht in der Luft einen Salto ---------- */
function updSki(dt,ix,u,d){
  if(P.ball>0){ updRoll(dt); return; }
  const snow=onSnow(), gk=hero.own.goldski?1:0;
  if(ix) P.face=ix;
  if(u){
    P.vy+=(-230*(1+.25*hero.up.jet)-P.vy)*Math.min(1,dt*6); P.on=false; P.jet=true;
    if(Math.random()<dt*40) spawn(1,P.x-P.face*8,P.y-14,(Math.random()-.5)*30,130,.25,4);
  }
  if(P.on){
    const gs=P.gs, v=Math.abs(P.vx);
    P.vx+=G*gs/(1+gs*gs)*dt*(snow?1:.3);
    /* Unten im Auslauf liegt tiefer Schnee: Er bremst, damit man neben dem Lift zum Stehen kommt. */
    P.vx-=P.vx*Math.min(1,dt*((d?(snow?2.6:5):(snow?.15-.05*gk:2.8))+(P.vx<0&&P.x<6060&&P.x>5700?1.9:0)));
    if(ix&&P.vx*ix<190+25*hero.up.motor+50*gk) P.vx+=ix*(snow?320:200)*dt;
    P.vx=clamp(P.vx,-820,820);
    if(snow){
      if(v>90&&Math.random()<dt*(d?40:v*.03)) spawn(10,P.x-P.face*12,P.y-2,-P.vx*.2+(Math.random()-.5)*40,-30-Math.random()*(d?130:60),.4,2+Math.random()*2.5);
      if(v>220){ swishT-=dt; if(swishT<=0){ swishT=.3; sfx('swish'); } }
      if(gk&&v>200&&Math.random()<dt*14) spawn(5,P.x-P.face*14,P.y-3,0,-30,.5,2);
    }
  }else{
    if(!u) P.vy=Math.min(P.vy+grav()*dt,780);
    P.vx+=ix*60*dt;
    if(P.spin){ const st=Math.sign(P.spin)*Math.min(Math.abs(P.spin),10.5*dt); P.ang+=st; P.spin-=st; P.rot+=Math.abs(st); }
  }
  const pv=P.vy, wasAir=P.air;
  if(mover(dt,6,30,18,10)){ if(Math.abs(P.vx)>150) puff(P.x+P.face*8,P.y-12,6); P.vx*=-.25; }
  if(P.on){
    if(P.landed){
      if(Math.abs(P.spin)>.9){ P.ball=1.7; shout(P.x,P.y-52,'PLUMPS!'); sfx('splat'); puff(P.x,P.y-8,12); }
      else{
        const n=Math.round(P.rot/TAU);
        if(n>0){ shout(P.x,P.y-54,n>1?n+' × SALTO!':'SALTO!','#ffd23f'); gold+=n; popG+=n; lootDirty=true; addXp(2*n); sfx('pop'); qEvent('salto',n); }
        else if(wasAir>1&&!P.jet) shout(P.x,P.y-54,'JUHU!');
        if(pv>260) puff(P.x,P.y-2,7);
        P.ang=Math.atan(P.gs);
      }
      P.spin=0; P.rot=0; P.jet=false;
    }
    P.air=0; P.vy=P.gs*P.vx;
    if(P.ball<=0) P.ang+=(Math.atan(P.gs)-P.ang)*Math.min(1,dt*14);
    /* Wer an einer Tanne vorbeisaust, schüttelt den Schnee herunter. */
    if(Math.abs(P.vx)>120) for(const tr of trees) if(tr.fir&&tr.state===0&&Math.abs(tr.x-P.x)<9&&Math.abs(tr.gy-P.y)<40&&!(tr.sh>time)){ tr.sh=time+1.5; puff(tr.x,tr.gy-tr.h*.7,12); }
  }else P.air+=dt;
}
/* Mitten im Salto gelandet: Der Held kugelt als Schneeball weiter und plumpst dann wieder heraus. */
function updRoll(dt){
  P.ball-=dt;
  if(P.on){ const gs=P.gs; P.vx+=G*gs/(1+gs*gs)*dt; P.vx-=P.vx*Math.min(1,dt*(onSnow()?.5:3)); }
  else P.vy=Math.min(P.vy+grav()*dt,780);
  if(mover(dt,9,26,18,8)) P.vx*=-.4;
  if(P.on) P.vy=P.gs*P.vx;
  P.ang+=P.vx/16*dt;
  if(Math.random()<dt*14) puff(P.x,P.y-4,1);
  if(P.ball<=0){ P.ball=0; P.ang=0; P.spin=0; P.rot=0; puff(P.x,P.y-14,16); shout(P.x,P.y-50,'PLOPP!'); sfx('pop'); P.vy=-190; P.on=false; }
}
function skiAct(){
  if(P.ball>0) return;
  if(nearLift()){ rideLift(); return; }
  if(P.on){ P.vy-=350; P.y-=3; P.on=false; P.air=0; P.jet=false; sfx('jump'); }
  else if(Math.abs(P.spin)<TAU*1.5){ P.spin+=(P.vx>=0?-1:1)*TAU; sfx('whoosh'); }
}

/* ---------- Drachenflug auf Mama Glut: fliegt frei in alle Richtungen, die rote Taste spuckt Feuer und schmilzt Schnee ---------- */
function updDragon(dt,ix,u,d){
  if(ix) P.face=ix;
  P.vx+=(ix*310*(1+.15*hero.up.jet)-P.vx)*Math.min(1,dt*3);
  if(P.on&&!u) P.vy=Math.min(P.vy+grav()*dt,300);
  else P.vy+=((d-u)*270+((u||d||reduced)?0:16*Math.sin(time*3))-P.vy)*Math.min(1,dt*4);
  if(u&&P.on){ P.on=false; P.y-=3; }
  if(mover(dt,24,58,22,16)) P.vx*=-.2;
  if(P.on) P.vy=0;
  P.ang+=(clamp(P.vy/500,-.35,.35)*P.face-P.ang)*Math.min(1,dt*6);
  if(keys.a){ P.digT-=dt; if(P.digT<=0){ P.digT=.05; breathe(); } }
}
function melt(cx,cy){
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    if(dx*dx+dy*dy>5) continue;
    const x=cx+dx, y=cy+dy; if(!inGrid(x,y)) continue;
    const i=y*GX+x;
    if(grid[i]===SNOW||grid[i]===ICE){ grid[i]=0; steam(x,y); }
  }
}
function breathe(){
  const mx=P.x+P.face*62, my=P.y-63;
  for(let k=0;k<2;k++) spawn(1,mx,my,P.face*(300+Math.random()*160)+P.vx,(Math.random()-.3)*120+P.vy*.5,.35+Math.random()*.2,7+Math.random()*6);
  sfx('flame');
  for(let r=20;r<=170;r+=12){
    const x=mx+P.face*r, y=my+r*.24, cx=Math.floor(x/CELL), cy=Math.floor((y-TOP)/CELL);
    if(!inGrid(cx,cy)) break;
    const m=grid[cy*GX+cx];
    if(m===SNOW||m===ICE){ melt(cx,cy); break; }
    if(m===WATER){ steam(cx,cy); break; }
    if(m>=4){ if(Math.random()<.5) putUp(cx-P.face,cy,FIRE); break; }
  }
}

  const sx=from?from[0]:P.x+P.face*6, sy=from?from[1]:P.y-30, dx=tx-sx, dy=ty-sy, T=clamp(Math.hypot(dx,dy)/520,.3,.95);

}

function ballsTick(dt){

/* Schaufel und Spitzhacke: zu Fuß graben, ohne Akku. Die Schaufel ist schnell, schafft aber nur Erde, Sand und Schnee. Die Spitzhacke schafft auch Fels und Eis, nur langsamer. Harte Schichten bleiben wie beim Bagger dem Bohrer vorbehalten. Aktionstaste gräbt nach vorn, mit Runter nach unten. */

const ARROWS=[], TGT=[{x:1640,h:46},{x:1790,h:78},{x:1930,h:58}];

  const go=b.dataset.go;
  if(go==='next'){ mapPg++; renderMap(); return; }
  if(go===''){ speak('Weiter rechts liegen noch mehr Länder. Die musst du erst entdecken.'); return; }
  $('map').hidden=true;
  if(b.dataset.gy){ if(P.mode!=='walk') setMode('walk'); grow(+go+3200); P.x=+go; P.y=+b.dataset.gy-2; P.vx=0; P.vy=0; cam.x=P.x; cam.y=P.y-80; smoke(P.x,P.y-20,6); speak('Zur Leuchtmarke!'); return; }

function renderEggs(){
  $('eggs').innerHTML='<span class="eggn">'+EGGSVG+'<b>'+(hero.eggs|0)+'</b></span>'+WEAR.map(function(q){
    const own=q[0]<0?!!hero.own[q[2]]:(hero.eggs|0)>=q[0], on=hero.pet===q[2]||hero.hat===q[2]||(q[1]==='trail'&&hero.trail);
    if(q[0]<0&&!own) return '';
    const pic=q[1]==='pet'?PETS[q[2]]:q[1]==='hat'?EHAT[q[2]]:'🌈';
    return '<button class="'+(own?(on?'on':''):'q')+'" data-wear="'+q[2]+'" aria-label="'+(own?q[3]:'Für '+q[0]+' goldene Eier')+'">'+(own?pic:q[0])+'</button>';
  }).join('');

function eggClick(e){
  const b=e.target.closest('[data-wear]'); if(!b) return;
  const q=WEAR.find(function(w){return w[2]===b.dataset.wear;}), own=q[0]<0?!!hero.own[q[2]]:(hero.eggs|0)>=q[0];
  if(!own){ tone([170],'sawtooth'); speak('Dafür brauchst du '+q[0]+' goldene Eier.'); return; }

function mkMuster(lv){

  else if(lv===2){ unit=[0,1,2]; len=7; }

  else if(lv===4){ unit=ri(0,1)?[0,0,1,1]:[0,1,0,2]; len=9; mid=ri(0,1)===1; }

    st.hole=lv===5?4:ri(2,4);

    st.hole=lv===6?len-1:ri(4,len-2);

  }
  if(unit){ for(let i=0;i<len;i++) st.seq.push(T[unit[i%unit.length]]); st.hole=mid?ri(2,len-3):len-1; st.u=unit.length; }

/* ---------- 3. Roboter: eine Folge von Pfeilen planen, dann läuft der Roboter sie ab. ---------- */
const RBL=[[4,3,1,0,0,9],[4,4,3,0,0,9],[5,4,5,0,0,9],[5,5,7,0,0,9],[5,5,6,1,0,9],[6,5,8,1,2,9],[6,5,8,2,2,2],[6,6,10,2,3,1],[7,6,12,3,4,1],[7,6,14,3,5,0]];
const RBD=[[1,0],[0,1],[-1,0],[0,-1]], ARW=['➡️','⬇️','⬅️','⬆️'];
/* Sucht den Weg mit den wenigsten Richtungswechseln: erst alle Edelsteine, dann zur Fahne. */
function rbSolve(st){
  const w=st.w, h=st.h, n=w*h, G=st.gems, full=(1<<G.length)-1;
  const dist=new Int16Array(n*40).fill(999), prev=new Int32Array(n*40).fill(-1), k0=(st.s*5+4)*8, dq=[k0];
  let end=-1; dist[k0]=0;
  while(dq.length){
    const k=dq.shift(), m=k&7, pd=k>>3, d=pd%5, p=(pd-d)/5;
    if(p===st.g&&m===full){ end=k; break; }
    const x=p%w, y=(p-x)/w;
    for(let nd=0;nd<4;nd++){
      const nx=x+RBD[nd][0], ny=y+RBD[nd][1];
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const np=ny*w+nx;
      if(st.wall.has(np)||st.lava.has(np)) continue;
      const gi=G.indexOf(np), nm=gi>=0?m|(1<<gi):m, c=dist[k]+(nd===d?0:1), nk=(np*5+nd)*8+nm;
      if(c<dist[nk]){ dist[nk]=c; prev[nk]=k; if(nd===d) dq.unshift(nk); else dq.push(nk); }
    }
  }
  if(end<0) return null;
  const dirs=[]; for(let k=end;prev[k]>=0;k=prev[k]) dirs.push((k>>3)%5);
  dirs.reverse();
  const sol=[];
  for(const d of dirs){ const l=sol[sol.length-1]; if(l&&l.d===d&&l.n<9) l.n++; else sol.push({d:d,n:1}); }
  return sol;
}
function mkRobo(lv){
  const L=RBL[lv], w=L[0], h=L[1];
  for(let tr=0;tr<120;tr++){
    const c=shuffle(idxs(w*h)), a=2+L[3], b=a+L[2];
    const st={w:w,h:h,s:c[0],g:c[1],gems:c.slice(2,a),wall:new Set(c.slice(a,b)),lava:new Set(c.slice(b,b+L[4])),prog:[],max:12,sol:null,pos:c[0],got:0,bad:-1,cur:-1};
    const sol=rbSolve(st); if(!sol) continue;
    let steps=0; for(const q of sol) steps+=q.n;
    if(steps<Math.min(3+lv,9)||sol.length<Math.min(2+(lv>>1),4)||sol.length>9) continue;
    st.sol=sol; st.max=L[5]===9?Math.max(sol.length+3,6):sol.length+L[5];
    return st;
  }
  return mkRobo(Math.max(0,lv-1));
}
function drRobo(st){
  const cs=pzCell(st.w,st.h+1.3,true);
  let h='<div class="pzg" style="--cs:'+cs+'px;grid-template-columns:repeat('+st.w+',var(--cs))">';
  for(let i=0;i<st.w*st.h;i++){
    const wl=st.wall.has(i), lv=st.lava.has(i), gi=st.gems.indexOf(i);
    let c='';
    if(i===st.pos) c='🤖'; else if(i===st.g) c='🏁'; else if(gi>=0&&!((st.got>>gi)&1)) c='💎'; else if(lv) c='🔥';
    h+='<span class="pzc fix'+(wl?' wall':lv?' lava':'')+(i===st.pos?' me':'')+'">'+c+'</span>';
  }
  h+='</div><div class="prog" aria-label="Dein Programm">';
  for(let i=0;i<st.max;i++){ const q=st.prog[i]; h+='<span class="slot'+(q?' on':'')+(i===st.bad?' bad':'')+(i===st.cur?' cur':'')+'">'+(q?ARW[q.d]+(q.n>1?'<b>'+q.n+'</b>':''):'')+'</span>'; }
  h+='</div>';
  const ctl='<div class="rbctl"><span class="dpad"><button class="pzb sm u" data-a="3" aria-label="Nach oben">⬆️</button><button class="pzb sm l" data-a="2" aria-label="Nach links">⬅️</button><button class="pzb sm d" data-a="1" aria-label="Nach unten">⬇️</button><button class="pzb sm r" data-a="0" aria-label="Nach rechts">➡️</button></span>'+
    '<span class="rbside"><button class="pzb sm go" data-a="run" aria-label="Los">▶</button><button class="pzb sm" data-a="del" aria-label="Letzten Pfeil löschen">↩️</button></span></div>';
  return [h,ctl];
}
function acRobo(st,a){
  if(a==='run'){ rbRun(st); return; }
  st.bad=-1;
  const l=st.prog[st.prog.length-1];
  if(a==='del'){ if(l){ if(l.n>1) l.n--; else st.prog.pop(); } }
  else{
    const d=+a;
    if(l&&l.d===d&&l.n<9) l.n++;
    else if(st.prog.length<st.max) st.prog.push({d:d,n:1});
    else{ tone([170],'sawtooth'); speak('Mehr Pfeile passen nicht hinein. Findest du einen Weg mit weniger Kurven?'); return; }
  }
  sfx('tick'); pzDraw();
}
function rbRun(st){
  if(!st.prog.length){ speak('Tippe erst auf die Pfeile. Dann auf Los.'); return; }
  const c=pzc, steps=[], all=(1<<st.gems.length)-1;
  st.prog.forEach(function(q,i){ for(let k=0;k<q.n;k++) steps.push([q.d,i]); });
  c.busy=true; st.pos=st.s; st.got=0; st.bad=-1; st.cur=-1;
  let i=0;
  const fail=function(slot,why){
    st.bad=slot; st.cur=-1; pzDraw(); pzFail(); if(why) speak(why);
    pzLater(1000,function(){ st.pos=st.s; st.got=0; c.busy=false; pzDraw(); });
  };
  const next=function(){
    if(i>=steps.length){ fail(st.prog.length-1,st.pos===st.g?'Erst alle Edelsteine einsammeln, dann zur Fahne.':'Der Roboter ist noch nicht bei der Fahne. Was fehlt noch?'); return; }
    const d=steps[i][0], x=st.pos%st.w, y=(st.pos-x)/st.w, nx=x+RBD[d][0], ny=y+RBD[d][1], np=ny*st.w+nx;
    st.cur=steps[i][1];
    if(nx<0||ny<0||nx>=st.w||ny>=st.h||st.wall.has(np)){ sfx('splat'); fail(steps[i][1],'Rums! Da geht es nicht weiter. Schau, welcher Pfeil rot ist.'); return; }
    st.pos=np;
    const gi=st.gems.indexOf(np);
    if(gi>=0&&!((st.got>>gi)&1)){ st.got|=1<<gi; sfx('coin'); } else sfx('tick');
    if(st.lava.has(np)){ fail(steps[i][1],'Heiß! Der Roboter darf nicht ins Feuer.'); return; }
    if(np===st.g&&st.got===all){ st.cur=-1; pzDraw(); c.busy=false; pzWin(); return; }
    i++; pzDraw(); pzLater(300,next);
  };
  pzDraw(); pzLater(260,next);
}
function hiRobo(st){
  const n=Math.max(1,Math.min(Math.floor(st.sol.length/2),pzc.hint));
  st.prog=st.sol.slice(0,n).map(function(q){ return {d:q.d,n:q.n}; }); st.bad=-1; st.pos=st.s; st.got=0;
  pzDraw(); speak('Ich zeige dir den Anfang. Fahr den Weg mit dem Finger nach. Wie geht es weiter?');
}
function syRobo(st){
  return 'Bring den Roboter zur Fahne. Tippe die Pfeile in der richtigen Reihenfolge, dann auf Los.'+(st.gems.length?' Sammle unterwegs '+(st.gems.length>1?'alle Edelsteine':'den Edelstein')+' ein.':'')+(st.lava.size?' Pass auf das Feuer auf.':'')+(st.max<st.sol.length+3?' Du hast nur wenige Felder. Gleiche Pfeile hintereinander brauchen nur ein Feld.':'');
}

/* ---------- 4. Waage: beide Seiten gleich schwer machen oder herausfinden, wie schwer das Geschenk ist. ---------- */
function mkWaage(lv){
  const st={L:[],R:[],pal:null,items:null,box:0,opts:null,over:false,ang:0};
  const pick=function(arr,n){ return shuffle(arr.slice()).slice(0,n); }, sum=function(a){ let s=0; for(const v of a) s+=v; return s; };
  /* Zahlen bis 20: ab Stufe 3 gibt es die 10, ab Stufe 4 muss man über die 10 hinweg rechnen. Der Schulstand begrenzt die Stufe. */
  if(SCH.on) lv=Math.min(lv,[1,2,3,9][SCH.zr]);
  if(lv===0){ st.pal=[1,2]; st.L=[ri(3,5)]; }
  else if(lv===1){ st.pal=[1,2,5]; st.L=[ri(6,10)]; }
  else if(lv===2){ st.pal=[1,2,5]; st.L=[ri(2,5),ri(2,5)]; }
  else if(lv===3){ st.pal=[1,2,10]; st.L=[ri(11,15)]; }
  else if(lv===4){ const a=ri(6,9); st.pal=[1,2,5,10]; st.L=[a,ri(11-a,9)]; }
  else if(lv===5){ const b=ri(2,9), a=ri(5,10); st.box=b; st.L=[-1,a]; st.R=[{w:a+b,fix:1}]; }
  else if(lv===6){ st.items=[10,5,5,2,2,1,1]; let t; do t=sum(pick(st.items,ri(3,4))); while(t>20); st.L=[t]; }
  else if(lv===7){ const pre=ri(5,10); st.items=[1,2,3,4,5,6]; st.R=[{w:pre,fix:1}]; st.L=[Math.min(20,pre+sum(pick(st.items,2)))]; }
  else if(lv===8){ const b=ri(3,8), a=ri(1,4); st.box=b; st.L=[-1,-1,a]; st.R=[{w:2*b+a,fix:1}]; }
  else{ const b=ri(3,8), a=ri(1,4); st.box=b; st.L=[-1,-1,a]; st.R=[{w:-1,fix:1},{w:b+a,fix:1}]; }
  if(st.items) st.items=st.items.map(function(w){ return {w:w,used:false}; });
  if(st.box){ const o=[st.box]; for(const v of shuffle([st.box-1,st.box+1,st.box+2,st.box-2,st.box+3])) if(o.length<4&&v>0&&o.indexOf(v)<0) o.push(v); st.opts=shuffle(o); }
  return st;
}
function wgDiff(st){ let d=0; for(const v of st.L) d+=v<0?st.box:v; for(const q of st.R) d-=q.w<0?st.box:q.w; return d; }
function wgW(w,cls,attr){ return w<0?'<span class="wt box" aria-label="Geschenk">🎁</span>':'<'+(attr?'button':'span')+' class="wt'+(w>=10?' w10':'')+(cls||'')+'"'+(attr||'')+'>'+w+'</'+(attr?'button':'span')+'>'; }
function drWaage(st){
  let h='<div class="wg"><div class="beam" id="pz-beam" style="transform:rotate('+st.ang+'deg)"><div class="pan l">';
  for(const v of st.L) h+=wgW(v,' fixw');
  h+='</div><div class="pan r">';
  st.R.forEach(function(q,i){ h+=q.fix?wgW(q.w,' fixw'):wgW(q.w,'',' data-a="r'+i+'" aria-label="Gewicht '+q.w+' wieder herunternehmen"'); });
  h+='</div></div><i class="post"></i></div>';
  let c='<div class="pzopts">';
  if(st.box) for(const v of st.opts) c+='<button class="pzb" data-a="o'+v+'">'+v+'</button>';
  else if(st.items) st.items.forEach(function(q,i){ c+='<button class="pzb sm'+(q.used?' no':'')+'" data-a="p'+i+'"'+(q.used?' disabled':'')+' aria-label="Gewicht '+q.w+' auflegen">'+q.w+'</button>'; });
  else st.pal.forEach(function(w,i){ c+='<button class="pzb" data-a="p'+i+'" aria-label="Gewicht '+w+' auflegen">'+w+'</button>'; });
  return [h,c+'</div>'];
}
/* Der Balken kippt erst nach dem Zeichnen, damit man die Bewegung sieht. */
function poWaage(st){
  const a=clamp(-wgDiff(st)*2.2,-11,11);
  if(a===st.ang) return;
  st.ang=a;
  requestAnimationFrame(function(){ const b=$('pz-beam'); if(b) b.style.transform='rotate('+a+'deg)'; });
}
function acWaage(st,a,b){
  const k=a.charAt(0), i=+a.slice(1);
  if(k==='o'){
    if(i===st.box){ b.classList.add('ok'); pzWin(); return; }
    b.classList.add('no'); pzFail();

  }

    else st.R.push({w:st.pal[i],i:-1});
  }else{

  }
  sfx('tick');
  const d=wgDiff(st);

}
function hiWaage(st){
  const d=wgDiff(st);
  if(st.box) speak('Nimm in Gedanken auf beiden Seiten gleich viel weg. Was bleibt dann für das Geschenk übrig?');
  else if(d>=10&&st.pal&&st.pal.indexOf(10)>=0) speak('Links ist es mehr als 10. Lege erst die 10 auf, dann den Rest.');

  else speak('Rechts ist es zu schwer. Zähle beide Seiten zusammen. Tippe rechts ein Gewicht an, dann kommt es wieder herunter.');
}
function syWaage(st){
  if(st.box) return 'Die Waage steht gerade. Wie schwer ist das Geschenk?'+(st.L.filter(function(v){ return v<0; }).length>1?' Alle Geschenke sind gleich schwer.':'');

/* ---------- 6. Rohre: Rohrstücke drehen, bis das Wasser von links bis zur Pflanze fließt. ---------- */
const RHL=[[3,2,0],[3,3,0],[4,3,0],[4,4,0],[4,4,1],[5,4,1],[5,5,1],[5,5,2],[6,5,2],[6,6,2]], RMASK=[10,3,11];
const RSVG=['<path d="M0 12h24"','<path d="M12 0v5a7 7 0 0 0 7 7h5"','<path d="M0 12h24M12 0v12"'];
function rhRot(m,r){ for(let i=0;i<r;i++) m=((m<<1)&15)|(m>>3); return m; }
function rhMask(st,p){ return st.t[p]===3?0:rhRot(RMASK[st.t[p]],st.r[p]); }
function rhFlow(st){
  const w=st.w, h=st.h, f=new Set(), s=st.ys*w, N=[[1,0,-1,4],[2,1,0,8],[4,0,1,1],[8,-1,0,2]];
  if(!(rhMask(st,s)&8)) return f;
  const q=[s]; f.add(s);
  while(q.length){
    const p=q.pop(), x=p%w, y=(p-x)/w, m=rhMask(st,p);
    for(const n of N){
      if(!(m&n[0])) continue;
      const nx=x+n[1], ny=y+n[2];
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const np=ny*w+nx;
      if(f.has(np)||!(rhMask(st,np)&n[3])) continue;
      f.add(np); q.push(np);
    }
  }
  return f;
}
function rhDone(st,f){ const e=st.ye*st.w+st.w-1; return f.has(e)&&(rhMask(st,e)&2)>0; }
function mkRohre(lv){
  const L=RHL[lv], w=L[0], h=L[1];
  for(let tr=0;tr<80;tr++){
    const ys=ri(0,h-1), ye=ri(0,h-1), seen=new Set(), path=[];
    const dfs=function(x,y){
      const p=y*w+x; seen.add(p); path.push(p);
      if(x===w-1&&y===ye) return true;
      for(const d of shuffle([[1,0],[0,1],[0,-1],[-1,0]])){
        const nx=x+d[0], ny=y+d[1];
        if(nx<0||ny<0||nx>=w||ny>=h||seen.has(ny*w+nx)) continue;
        if(dfs(nx,ny)) return true;
      }
      path.pop(); return false;
    };
    if(!dfs(0,ys)) continue;
    if(path.length<Math.min(w+1+(lv>>1),w*h-2)||path.length>w*h*.75) continue;
    const st={w:w,h:h,ys:ys,ye:ye,t:[],r:[],sr:[],lk:[],ang:[],need:0,taps:0};
    const on={};
    for(let i=0;i<path.length;i++){
      const p=path[i], x=p%w, y=(p-x)/w; let m=0;

function dbDump(name){
  return new Promise(function(res){
    let rq;
    try{ rq=indexedDB.open(name); }catch(_){ res(null); return; }
    rq.onupgradeneeded=function(){ try{ rq.transaction.abort(); }catch(_){} };
    rq.onerror=function(e){ if(e&&e.preventDefault) e.preventDefault(); res(null); };
    rq.onsuccess=function(){
      const db=rq.result, names=Array.prototype.slice.call(db.objectStoreNames);
      if(!names.length){ db.close(); res(null); return; }
      const out={v:db.version,st:{}}, tx=db.transaction(names,'readonly');
      names.forEach(function(n){
        const os=tx.objectStore(n), e={kp:os.keyPath,ai:os.autoIncrement,k:[],r:[]};
        out.st[n]=e;
        os.getAllKeys().onsuccess=function(ev){ e.k=ev.target.result; };
        os.getAll().onsuccess=function(ev){ e.r=ev.target.result; };
      });
      tx.oncomplete=function(){ db.close(); res(out); };
      tx.onerror=tx.onabort=function(){ db.close(); res(null); };
    };
  });
}

  if(P.mode==='boat') return boatWet()?'horn':'exit';
  if(P.mode==='heli') return P.on&&!heliLoad?'exit':'hook';
  if(P.mode==='car') return 'turbo';

/* ---------- Spielprotokoll für Eltern: Was er wann spielt und wie er Aufgaben löst. Liegt nur auf diesem Gerät, in einer eigenen Datenbank, damit ein Fehler hier nie den Spielstand trifft. Das Protokoll schaut nur zu: Nichts davon ändert Belohnung oder Schwierigkeit. ---------- */
const LOG=(function(){
  const KEEP=90, IDLE=60, buf=[], acc={};
  let dbp=null, q=null, flushT=0, lastIn=performance.now(), accDay='';

      let rq;
      try{ rq=ver?indexedDB.open('lavaland-log',ver):indexedDB.open('lavaland-log'); }catch(e){ rej(e); return; }

        if(!db.objectStoreNames.contains('day')) db.createObjectStore('day',{keyPath:'d'});
        const es=rq.transaction.objectStore('ev'); if(!es.indexNames.contains('d')) es.createIndex('d','d');

        const db=rq.result;
        let ok=false; try{ ok=db.objectStoreNames.contains('day')&&db.transaction('ev').objectStore('ev').indexNames.contains('d'); }catch(_){}
        if(!ok){ const v=db.version+1; db.close(); if(ver) rej(new Error('log db')); else op(v).then(res,rej); return; }
        db.onversionchange=function(){ db.close(); dbp=null; }; res(db);
      };
      rq.onerror=function(){ rej(rq.error); };
    });
  }
  function open(){
    if(!dbp){ dbp=op(0); dbp.catch(function(){ dbp=null; }); }
    return dbp;
  }
  function push(e){ if(frozen) return; e.d=day(e.t); buf.push(e); }
  function flush(){
    if(frozen||(!buf.length&&!accDay)) return;
    const evs=buf.splice(0), d=accDay, sec=Object.assign({},acc), ss=acc.$s|0;
    for(const k in acc) delete acc[k]; accDay='';
    open().then(function(db){
      const tx=db.transaction(['ev','day'],'readwrite'), es=tx.objectStore('ev');
      evs.forEach(function(e){ es.add(e); });
      if(d){
        const ds=tx.objectStore('day'), g=ds.get(d);
        g.onsuccess=function(){
          const r=g.result||{d:d,sec:{},sess:0};
          for(const k in sec) if(k!=='$s') r.sec[k]=Math.round(((r.sec[k]||0)+sec[k])*10)/10;
          r.sess=(r.sess|0)+ss; ds.put(r);
        };

    }).catch(function(){});
  }
  /* Rohereignisse nach 90 Tagen weg, die Tagesbilanzen bleiben. */
  function prune(){
    const cut=day(Date.now()-KEEP*864e5);
    open().then(function(db){
      const c=db.transaction('ev','readwrite').objectStore('ev').index('d').openCursor(IDBKeyRange.upperBound(cut,true));
      c.onsuccess=function(){ const k=c.result; if(k){ k.delete(); k.continue(); } };
    }).catch(function(){});
  }
  function state(){
    if(!$('par').hidden||!$('pgate').hidden) return '';
    if((performance.now()-lastIn)/1000>IDLE) return 'idle';
    if(pzc) return 'pz';
    if(!$('quiz').hidden) return 'quiz';
    if(paused||uiOpen()) return 'ui';
    return energy<=0?'empty':'play';
  }
  function qEnd(how){
    if(!q) return;
    const e=q; q=null; delete e.p0; e.end=how; e.first=e.taps.length>0&&e.taps[0][0]===e.ok; push(e);
  }
  function pEnd(c,how){
    if(!c||!c.lg) return;
    const g=c.lg; c.lg=null;
    push({k:'p',t:g.t,id:c.T.id,lv:c.lv,src:c.m.quiz?'akku':'welt',ms:Math.round(performance.now()-g.p0),fails:c.fails,hint:c.hint,fph:g.fph,end:how});
  }
  ['pointerdown','keydown'].forEach(function(n){ document.addEventListener(n,function(){ lastIn=performance.now(); },true); });

  window.addEventListener('pagehide',flush);
  return {
    open:open, day:day, flush:flush, state:state,
    start:function(){ try{ prune(); acc.$s=(acc.$s|0)+1; accDay=day(); push({k:'s',t:Date.now()}); flush(); }catch(_){} },
    tick:function(raw){

          if(s==='play'||s==='empty'){ const m='m:'+P.mode; acc[m]=(acc[m]||0)+r; if(tool){ const t='t:'+tool; acc[t]=(acc[t]||0)+r; } }
        }

      }catch(_){}
    },
    qOpen:function(){ try{ push({k:'qo',t:Date.now()}); }catch(_){} },
    qStart:function(c,u){

        qEnd('skip');
        const e={k:'q',t:Date.now(),ty:c.type,f:c.f,L:c.L,n:c.pad?21:c.opts.length,bx:c.box,ok:c.ans,taps:[],tts:null,p0:performance.now()};

    qClose:function(){ try{ if(q){ qEnd('quit'); push({k:'x',t:Date.now(),what:'quiz',left:Math.ceil((MAXE-energy)/SEG)}); } }catch(_){} },
    qSwitch:function(){ try{ qEnd('switch'); push({k:'x',t:Date.now(),what:'switch'}); }catch(_){} },
    pStart:function(c){ try{ c.lg={t:Date.now(),p0:performance.now(),fph:null}; }catch(_){} },
    pHint:function(c){ try{ if(c&&c.lg&&c.lg.fph===null) c.lg.fph=c.fails; }catch(_){} },
    pWin:function(c){ try{ pEnd(c,'won'); }catch(_){} },
    pQuit:function(c){ try{ if(c&&!c.won) pEnd(c,'quit'); }catch(_){} }
  };
})();

    if(accum>.1) accum=0;
    update(dt); arrowsTick(dt); monTick(dt); geyTick(dt); metTick(dt); wreckTick(dt); worldTick(dt); deepTick(dt); winterTick(dt); taskTick(dt); findsTick(dt); questTick(dt); misTick(dt); autosave(dt); drain(dt); fogTick(dt); mkTick();
    /* Läuft es auf diesem Gerät zu langsam, sinkt die Auflösung in Stufen. */
    if(raw<.2){ perfT+=raw; perfN++; }
    if(perfN>=150){ if(perfT/perfN>.026&&maxDpr>1){ maxDpr=Math.max(1,maxDpr-.5); resize(); } perfT=0; perfN=0; }
  }
  /* Akku sparen: Hinter einem offenen Fenster steht die Welt still, dann reichen 6 Bilder pro Sekunde. Ohne Berührung reichen 30. */
  drawN++;
  const every=(paused||uiOpen())?10:LOG.state()==='idle'?2:1;
  if(drawN>=every){ drawN=0; draw(); }
  const ic=actIcon(); if(ic!==lastIcon){ actEl.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+AI[ic]+'</svg>'; lastIcon=ic; }
  requestAnimationFrame(frame);
}

function start(){
  resize();
  const go=function(){
    ready=true; LOG.start(); updateStars(); renderAlbum(); syncUI(); syncSound(); battShown=-1; renderBatt();
    stEnter(); syncOwn(); renderStory();
    let psst=0; try{ psst=+localStorage.getItem('lavaland-psst')||0; }catch(_){}
    if(!hero.st.on){ if(psst<3) setTimeout(function(){ if(!hero.st.on&&!uiOpen()&&!paused){ try{ localStorage.setItem('lavaland-psst',String(psst+1)); }catch(_){} say('','Psst! Über Nacht ist etwas Seltsames passiert. Tippe auf das Buch!'); pulse('btn-story'); } },2800); else pulse('btn-story'); }
    else if(!hero.big) setTimeout(function(){ if(!uiOpen()&&!paused){ hero.big=true; if(nextLand()){ hero.quest={type:'land',goal:1,p:0}; showQuest(false); } saveHero(); say('','Neu! Hinter dem Schneeberg liegen jetzt viele fremde Länder. Fahr hinten am Berg hinunter und entdecke sie!'); pulse('btn-map'); } },2800);
    if(hero.quest&&hero.quest.type==='core'&&hero.dr<3) hero.quest=null;
    if(hero.st.on&&hero.big&&!hero.deep) setTimeout(function(){ if(!uiOpen()&&!paused) deepIntro(); },2800);
    labBadge(false);
    if(!hero.quest||hero.quest.done||!QDEF[hero.quest.type]) hero.quest=newQuest();
    showQuest(false); pulse('quest');
    /* Einmal am Tag gibt es ein kleines Geschenk. Kein Zähler, nichts geht verloren, wenn man einen Tag auslässt. */
    const today=new Date().toDateString();
    if(hero.day!==today){ hero.day=today; gold+=20; saveHero(); saveFinds(); setTimeout(function(){ banner('🎁 +20'+COIN,2400); },1300); }
    hudG=-1; hudLoot();
    if(energy<=0) pulse('batt');
    requestAnimationFrame(function(t){ last=t; requestAnimationFrame(frame); });
  };
  const tryLoad=function(sv){
    /* Ein Spielstand aus der alten, kleinen Welt bleibt zur Sicherheit unter eigenem Namen liegen. */
    if(sv&&sv.v<4) idbDo('readwrite',function(st){ return st.put(sv,sv.v===2?'world-alt':'world-v3'); }).catch(function(){});
    if(sv&&(runsOk(sv)||(sv.grid&&((sv.v===4&&sv.gy===GY&&sv.grid.length===sv.f*GY)||(sv.v===3&&sv.grid.length===sv.f*GY0)||(sv.v===2&&sv.grid.length===HOME_GX*GY0))))){ try{ restore(sv); return true; }catch(_){} }
    return false;
  };
  /* Erst der neue Spielstand, dann der alte. Erst wenn beides fehlt oder kaputt ist, gibt es eine neue Welt. */
  /* War das Kind zuletzt auf dem Mond oder einem Planeten, geht es dort weiter. Klappt das nicht, geht es auf der Erde weiter. */
  let rl=''; try{ rl=localStorage.getItem('lavaland-realm')||''; }catch(_){}
  const away=RLM[rl]?idbDo('readonly',function(st){ return st.get(realmKey(rl)); }).then(function(sv){
    if(!(sv&&runsOk(sv)&&sv.rl===rl)) return false;
    try{ setRealm(rl); restore(sv); return true; }catch(_){ setRealm(''); return false; }
  },function(){ return false; }):Promise.resolve(false);
  away.then(function(ok){
    if(ok) return true;
    setRealm('');
    return idbDo('readonly',function(st){ return st.get(SAVEKEY); });
  }).then(function(sv){
    if(sv===true) return true;
    if(tryLoad(sv)) return true;
    return idbDo('readonly',function(st){ return st.get('world'); }).then(tryLoad);
  }).then(function(ok){
    if(!ok) resetWorld(newSeed());
    go();
  },function(){ resetWorld(newSeed()); go(); });
}
document.addEventListener('visibilitychange',function(){ if(document.hidden) saveGame(false); });
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){ try{ hot.snapshot(function(){ saveGame(false); return {}; }); }catch(_){} }
if(hot&&hot.ready) hot.ready(start); else start();
})();
</script>
