<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lavaland</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7fd0e8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lavaland"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
/* Layout: Vollbild-Spielwelt, oben ein Raster aus Bild-Tasten (Fahrzeuge, Malwerkzeuge, Aufgaben), unten zwei Daumenfelder. Keine Schrift, nur Bilder. */
:root{
  --sky:#7fd0e8;
  --ink:#1d2a3a;
  --paper:#fff8e6;
  --ride:#dff3fb;
  --sun:#ffd23f;
  --lava:#ff5a1f;
  --good:#58b548;
  --font-ui:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-learn:'Andika','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-ui);
  overflow:hidden;touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{
  position:fixed;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;
  display:flex;flex-direction:column;gap:9px;pointer-events:none;
}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;pointer-events:auto}
.btn{
  position:relative;min-width:0;height:50px;padding:0;margin:0;cursor:pointer;touch-action:none;
  display:grid;place-items:center;color:var(--ink);
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);
}
.btn.veh{background:var(--ride)}
.btn.gold{background:var(--sun)}
.btn svg{width:30px;height:30px;display:block}
.btn[aria-pressed="true"]{background:var(--sun);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.warn{background:var(--lava)}
.btn:focus-visible,.key:focus-visible,#act:focus-visible,.card:focus-visible,#chip:focus-visible,#panel-x:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
.badge{
  position:absolute;right:-6px;top:-8px;min-width:20px;height:20px;padding:0 4px;box-sizing:border-box;
  border-radius:10px;background:var(--lava);color:var(--paper);border:2px solid var(--ink);
  font:700 12px/16px var(--font-ui);text-align:center;font-variant-numeric:tabular-nums;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16);background:var(--sun)}}
.pulse{animation:pulse .62s ease-in-out 4;z-index:2}

#chip{
  align-self:flex-start;pointer-events:auto;cursor:pointer;touch-action:none;
  display:flex;align-items:center;gap:6px;height:48px;padding:0 12px 0 8px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
}
#chip .tp{width:36px;height:36px}
#chip .ar{width:16px;height:16px}
#chip .tt{width:26px;height:26px}
#chip .bar{display:block;width:64px;height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
#chip .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .25s}
#chip.done{background:var(--sun)}

.pad{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;gap:10px;align-items:flex-end}
.pad.left{left:16px}
.pad.right{right:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.key{
  width:62px;height:62px;padding:0;border-radius:50%;cursor:pointer;touch-action:none;
  display:grid;place-items:center;color:var(--ink);
  background:rgba(255,248,230,.88);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
}
.key svg{width:30px;height:30px}
.key.down,#act.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--sun)}
#act{
  width:84px;height:62px;padding:0;border-radius:31px;cursor:pointer;touch-action:none;display:grid;place-items:center;
  color:var(--paper);background:var(--lava);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);
}
#act svg{width:34px;height:34px}
#act.down{color:var(--ink)}

#panel{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(29,42,58,.55)}
.sheet{
  position:relative;width:100%;max-width:560px;box-sizing:border-box;padding:16px;
  background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);
}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{
  position:relative;min-width:0;padding:8px;margin:0;cursor:pointer;display:grid;place-items:center;
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
}
.card svg.pic{width:72px;height:72px;max-width:100%}
.card .got{position:absolute;right:-7px;top:-9px;width:30px;height:30px}
.card.won{background:#f1f9e4}
#panel-x{
  position:absolute;right:-8px;top:-12px;width:42px;height:42px;padding:0;border-radius:50%;cursor:pointer;z-index:2;
  display:grid;place-items:center;background:var(--lava);color:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
#panel-x svg{width:20px;height:20px}

/* Lern-Akku, Schlösser und Lernaufgabe */
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#batt{
  pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:5px;height:48px;padding:0 10px 0 6px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
}
#batt svg{width:24px;height:24px}
.cells{display:flex;gap:3px}
.cells i{position:relative;display:block;width:11px;height:22px;box-sizing:border-box;border:2px solid var(--ink);border-radius:4px;background:#fff;overflow:hidden}
.cells i b{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--good)}
.cells.big{gap:5px}
.cells.big i{width:26px;height:36px;border-width:3px;border-radius:7px}
.lock{position:absolute;left:-6px;top:-8px;display:none}
.btn .lock svg{width:19px;height:19px}
.locked .lock{display:block}
.locked .cool>svg{opacity:.4;filter:grayscale(1)}
#quiz{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:16px;background:rgba(29,42,58,.6)}
.qsheet{
  position:relative;width:100%;max-width:440px;box-sizing:border-box;padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);
}
.qtop{display:flex;align-items:center;gap:12px}
.round{
  width:48px;height:48px;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
.round svg{width:26px;height:26px}
.round.go{background:var(--good);color:#fff}
.round:focus-visible,.opt:focus-visible,#batt:focus-visible,#quiz-x:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
#quiz-x{
  position:absolute;right:-8px;top:-12px;width:42px;height:42px;padding:0;border-radius:50%;cursor:pointer;z-index:2;
  display:grid;place-items:center;background:var(--lava);color:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
#quiz-x svg{width:20px;height:20px}
#q{min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--font-learn);color:var(--ink)}
.eq{font-size:46px;font-weight:700;line-height:1.15;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq.big{font-size:64px}
.hole{display:inline-block;min-width:.9em;padding:0 .1em;border:3px dashed var(--ink);border-radius:10px;color:var(--lava);text-align:center}
.objs{display:grid;grid-template-columns:repeat(5,36px);gap:4px}
.objs svg{width:36px;height:36px}
.dots{font-size:22px;line-height:1;letter-spacing:3px}
.da{color:#2f6fd6}
.db{color:#ff8a1f}
.dx{color:#c4bca6}
.qpic{width:96px;height:96px}
#ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.opt{
  min-width:0;height:64px;padding:0;margin:0;cursor:pointer;font:700 32px/1 var(--font-learn);color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
}
.opt.word{font-size:23px}
.opt.ok{background:var(--good);color:#fff}
.opt.no{background:#e9e4d6;color:#a39c8a;box-shadow:none;transform:translateY(4px)}

/* Auswahl-Fenster für Fahrzeuge, Werkzeuge und Funde */
.ov{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(29,42,58,.55)}
.xb{
  position:absolute;right:-8px;top:-12px;width:42px;height:42px;padding:0;border-radius:50%;cursor:pointer;z-index:2;
  display:grid;place-items:center;background:var(--lava);color:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
}
.xb svg{width:20px;height:20px;pointer-events:none}
.xb:focus-visible,.album button:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
.card.pick{padding:10px 8px}
.card.pick>svg{width:54px;height:54px;max-width:100%}
.card[aria-pressed="true"]{background:var(--sun)}
.card .lock{left:-7px;top:-9px}
.card .lock svg{width:24px;height:24px}
.btn.ok{background:var(--good)}
.loot{display:flex;gap:18px;justify-content:center;align-items:center;margin-bottom:12px;font:700 20px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.loot span{display:flex;align-items:center;gap:6px}
.loot svg{width:26px;height:26px}
.album{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.album button{
  min-width:0;aspect-ratio:1;padding:0;margin:0;cursor:pointer;font-size:25px;line-height:1;
  background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink);
}
.album button.q{background:#e9e4d6;color:#a39c8a;font:700 20px/1 var(--font-ui);cursor:default}
@keyframes near{0%,100%{transform:scale(1)}50%{transform:scale(1.14);background:#bfeaf7}}
.near{animation:near 1.3s ease-in-out infinite}
.hot{animation:near .42s ease-in-out infinite}

/* Auftrag, Banner, Menü */
#quest{
  pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
  font:700 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;
}
#quest svg{width:26px;height:26px}
#quest .bar{display:block;width:54px;height:12px;box-sizing:border-box;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
#quest .bar i{display:block;height:100%;width:0;background:#3aa0e8;transition:width .25s}
#quest.done{background:var(--sun)}
#quest:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
#batt,#mkt,#chip,#quest{height:44px}
@keyframes low{50%{background:#ffb09a}}
#batt.low{animation:low .6s ease-in-out infinite}
@keyframes bump{40%{transform:scale(1.1)}}
.bump{animation:bump .25s ease-out}
#banner{position:fixed;left:16px;right:16px;top:29%;z-index:7;display:flex;justify-content:center;pointer-events:none}
#banner span{
  display:flex;align-items:center;gap:8px;padding:11px 22px;border-radius:24px;white-space:nowrap;
  background:var(--sun);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:var(--ink);
  font:700 26px/1 var(--font-ui);font-variant-numeric:tabular-nums;
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .28s cubic-bezier(.3,1.6,.5,1);
}
#banner.show span{opacity:1;transform:none}
#banner svg{width:28px;height:28px}
.card.ok{background:var(--good)}
.card.warn{background:var(--lava)}
.ask{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:16px}
.ask svg{width:60px;height:60px}
.yn{display:flex;justify-content:center;gap:30px}
.round.big{width:72px;height:72px}
.round.big svg{width:38px;height:38px}
.round.nope{background:var(--lava);color:#fff}
.round.go{animation:near 1.3s ease-in-out infinite}

/* Held, Verbesserungen und Markt */
#mkt{
  pointer-events:auto;cursor:pointer;touch-action:none;display:flex;align-items:center;gap:4px;height:48px;padding:0 11px 0 7px;margin:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink);color:var(--ink);
  font:700 15px/1 var(--font-ui);font-variant-numeric:tabular-nums;
}
#mkt svg{width:18px;height:18px}
#mkt:focus-visible,.shopc:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
.lv{
  display:grid;place-items:center;min-width:26px;height:26px;padding:0 4px;box-sizing:border-box;border-radius:13px;
  background:#7b4fd6;color:#fff;border:2px solid var(--ink);font:700 14px/1 var(--font-ui);font-variant-numeric:tabular-nums;
}
.xpb{display:block;width:26px;height:9px;box-sizing:border-box;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;margin-right:3px}
.xpb i{display:block;height:100%;width:0;background:#7b4fd6}
.xpb.wide{width:84px;height:13px;border-radius:7px}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shopc{
  position:relative;min-width:0;padding:6px 2px 6px;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);color:var(--ink);
  font:700 12px/1.1 var(--font-learn);
}
.shopc .em{font-size:29px;line-height:1.1}
.shopc .pips{font-size:11px;line-height:1;letter-spacing:2px;color:#7b4fd6;min-height:11px}
.shopc .pr{display:flex;align-items:center;gap:2px;font:700 13px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.shopc .pr svg{width:14px;height:14px}
.shopc.poor .pr{color:#b0392b}
.shopc.poor,.shopc.lvl{background:#f1ede2}
.shopc.lvl .em{filter:grayscale(1);opacity:.5}
.shopc.max,.shopc.own{background:#f1f9e4}
.shopc.on{background:var(--sun)}
.shopc .yes{color:#2f8f4a;font-size:15px}

/* Große Welt: Karte zum Reisen und Belohnungen für goldene Eier */
.card.place{padding:8px 4px;font-size:34px;line-height:1.25}
.card.place small{position:absolute;right:7px;bottom:3px;font:700 12px/1 var(--font-ui)}
.card.place.cur{background:var(--sun)}
.card.place.shut{background:#e9e4d6}
.eggs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:2.5px dashed var(--ink)}
.eggn{display:flex;align-items:center;gap:4px;margin-right:4px;font:700 20px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.eggn svg{width:26px;height:26px}
.eggs button{width:40px;height:40px;padding:0;margin:0;cursor:pointer;font-size:23px;line-height:1;background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink)}
.eggs button.q{background:#e9e4d6;color:#a39c8a;font:700 15px/1 var(--font-ui)}
.eggs button.on{background:var(--sun)}
.eggs button:focus-visible{outline:3px solid var(--lava);outline-offset:2px}
@media (max-width:360px){
  .btn svg{width:24px;height:24px}
}
/* Tiefe und Höhe: Werkstatt, Aufzug und Rätselmaschinen */
#fade{position:fixed;inset:0;z-index:8;background:#0b0e1c;opacity:0;transition:opacity .35s;pointer-events:none}
#fade.on{opacity:1}
.labs{max-width:520px}
.inv{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-bottom:10px}
.inv button{position:relative;min-width:0;height:44px;padding:0;margin:0;cursor:pointer;font-size:21px;line-height:1;background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink)}
.inv button b{position:absolute;right:-4px;bottom:-6px;min-width:18px;height:18px;padding:0 3px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:var(--paper);font:700 12px/18px var(--font-ui);font-variant-numeric:tabular-nums}
.inv button.none{background:#e9e4d6}
.inv button.none span{filter:grayscale(1);opacity:.45}
.rc{display:grid;grid-template-columns:58px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:8px 0;border-top:2.5px dashed var(--ink)}
.rc .tl{display:flex;flex-direction:column;align-items:center;gap:3px;height:56px;padding:0;margin:0;justify-content:center;cursor:pointer;background:#fff;border:2.5px solid var(--ink);border-radius:14px;color:var(--ink);font-size:25px;line-height:1}
.rc .tl i{font:normal 11px/1 var(--font-ui);letter-spacing:2px;color:#7b4fd6}
.rc .need{display:flex;flex-wrap:wrap;gap:6px}
.chipm{display:flex;align-items:center;gap:3px;height:38px;padding:0 9px 0 5px;margin:0;cursor:pointer;border:2.5px solid var(--ink);border-radius:19px;background:#fff;color:var(--ink);font:700 15px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.chipm span{font-size:20px;line-height:1}
.chipm.ok{background:#dff2cf}
.chipm.no{background:#ffe1d6}
.mk{width:54px;height:54px;padding:0;margin:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:24px;line-height:1;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:#e9e4d6;color:var(--ink)}
.mk.wait{filter:grayscale(1);opacity:.6}
.mk.go{background:var(--good);animation:near 1.3s ease-in-out infinite}
.mk.max{background:#f1f9e4;box-shadow:none;color:#2f8f4a;font-weight:700}
.brain{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding-top:10px;border-top:2.5px dashed var(--ink)}
.brain button{min-width:0;padding:4px 3px 5px;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;color:var(--ink);font-size:20px;line-height:1}
.brain i{display:block;width:100%;height:8px;box-sizing:border-box;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
.brain i b{display:block;height:100%;background:#7b4fd6}
.inv button:focus-visible,.chipm:focus-visible,.mk:focus-visible,.rc .tl:focus-visible,.brain button:focus-visible{outline:3px solid var(--lava);outline-offset:2px}

#pz{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:12px;background:rgba(29,42,58,.62)}
.pzs{max-width:540px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
.pztop{display:flex;align-items:center;gap:12px}
.pzic{font-size:30px;line-height:1}
.pzlv{display:grid;grid-template-columns:repeat(5,9px);gap:3px}
.pzlv i{width:9px;height:9px;box-sizing:border-box;border-radius:50%;border:2px solid var(--ink);background:#fff}
.pzlv i.on{background:#7b4fd6}
#pz-hint,#quiz-pz{font-size:24px;line-height:1}
#pz-body{width:100%;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;--cs:44px}
#pz-body.win{animation:bump .5s ease-out 2}
#pz-ctl{width:100%;display:flex;justify-content:center}
#pz-ctl:empty{display:none}
.tok{width:36px;height:36px;display:block}
.pzrow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.pzt,.pzhole{width:42px;height:42px;box-sizing:border-box;display:grid;place-items:center}

/* Erzeugt eine Spalte der Welt: Schichten, Höhlen, Gold und Edelsteine, Wasser oder Lava in Becken, den Schneeberg. */

/* Die Heimat entsteht sofort, der Rest der Welt wächst beim Reisen. */

function put(cx,cy,t){

function steam(x,y){ if(Math.random()<.3) spawn(7,x*CELL+3,TOP+y*CELL,(Math.random()-.5)*20,-40-Math.random()*40,.9,5); }

function step(){

function mover(dt,hw,h,step,half){

  if(P.vx!==0){
    const nx=P.x+P.vx*dt, ex=nx+(P.vx>0?hw:-hw);
    if(solidW(ex,P.y-step-2)||solidW(ex,P.y-h*.55)||solidW(ex,P.y-h+2)) hit=true; else P.x=nx;
    boundsX();

  const sl=skyLim(); if(ny<sl){ ny=sl; if(P.vy<0)P.vy=0; }

/* Tunnelbohrmaschine: bohrt beim Fahren ein rundes Loch in Fahrtrichtung, auch durch Fels. ▲/▼ kippt den Bohrkopf. */
function updTbm(dt,ix,u,d){

/* Rakete: ▲ zündet das Triebwerk, ◀ ▶ steuert in der Luft. Ohne Schub sinkt sie langsam. */
function updRocket(dt,ix,u,d){

function updPlane(dt,ix,u,d){
  if(ix) P.face=ix;
  if(P.on){
    P.vx+=(ix*260-P.vx)*Math.min(1,dt*(ix?1.3:(P.y<-3000?4:.9)));

function updCoaster(dt,ix){

  if(T.lift){ liftRide(dt); return; }
  let q=trackAt(T,P.s);
  P.v+=G*.9*q.ty*dt+ix*T.dir*220*dt;
  P.v-=P.v*.08*dt;
  if(P.v<90) P.v+=(90-P.v)*Math.min(1,dt*4);
  if(P.v>1000) P.v=1000;
  P.s+=P.v*dt;
  q=trackAt(T,P.s);
  P.x=q.x; P.y=q.y; P.vx=q.tx*P.v; P.vy=q.ty*P.v; P.ang=Math.atan2(q.ty,q.tx); P.face=T.dir;
  if(P.s>=T.len){
    qEvent('ride',1);

    P.vy-=90; P.mode='walk'; P.on=false; P.air=.2; P.chute=false;

}
function settle(o,dt){

  else{ o.y=f; o.vy=0; o.ang+=(Math.atan(clamp((floorAt(o.x+16,o.y,26)-floorAt(o.x-16,o.y,26))/32,-1.3,1.3))-o.ang)*Math.min(1,dt*10); }
}

function update(dt){

  if(P.mode==='walk') updWalk(dt,ix,u,d);

  else if(P.mode==='ski') updSki(dt,ix,u,d);
  else if(P.mode==='dragon') updDragon(dt,ix,u,d);
  else if(P.mode==='sub') updSub(dt,ix,u,d);
  else updCoaster(dt,ix);

  if(P.mode!=='coaster'&&P.mode!=='dragon'&&P.hurt<=0&&FX.star<=0){
    let hot=burns(P.x,P.y-4)||burns(P.x,P.y-16);
    if(P.mode!=='walk'&&P.mode!=='ski'&&P.mode!=='plane'&&P.mode!=='rocket') hot=hot||burns(P.x-20,P.y-5)||burns(P.x+20,P.y-5);
    if(P.mode==='plane') hot=hot||burns(P.x+24*P.face,P.y-10);
    if(cellAt(P.x,P.y+3)===CORE) qEvent('core',1);

  }
  if(P.soot>0&&Math.random()<dt*8) spawn(0,P.x,P.y-30,(Math.random()-.5)*20,-40,.7,4);
  if(chest&&!chest.open&&Math.hypot(P.x-chest.x,P.y-12-chest.y)<34) chest.open=true;

  for(let i=bombs.length-1;i>=0;i--){
    const bm=bombs[i]; bm.t-=dt;

    if(bm.t<=0){ bombs.splice(i,1); blast(bm.x,bm.y); }
  }
  if(hero.pet){ pet.x+=(P.x-P.face*30-pet.x)*Math.min(1,dt*4); pet.y+=(P.y-16-pet.y)*Math.min(1,dt*5); }
  for(const k in parked) if(parked[k]) settle(parked[k],dt);
  if(parked.rocket) parked.rocket.ang=0;
  if(ghost){
    ghost.vy+=150*dt; ghost.x+=ghost.vx*dt; ghost.y+=ghost.vy*dt;
    if(ghost.x<50||ghost.x>WORLD_W-50) ghost.vx*=-1;
    if(Math.random()<dt*18) spawn(0,ghost.x,ghost.y-14,0,-10,.9,5);
    if(solidW(ghost.x,ghost.y)||solidW(ghost.x+(ghost.vx>0?30:-30),ghost.y-14)||hotAt(ghost.x,ghost.y-8)){ explode(ghost.x,ghost.y); ghost=null; }
  }
  for(const tr of trees){
    if(tr.state!==1) continue;
    tr.t-=dt;
    if(Math.random()<dt*22) spawn(1,tr.x+(Math.random()-.5)*34*tr.s,tr.gy-tr.h+(Math.random()-.3)*30,(Math.random()-.5)*20,-50-Math.random()*50,.5+Math.random()*.4,6+Math.random()*5);
    if(Math.random()<dt*5) spawn(0,tr.x,tr.gy-tr.h-20,(Math.random()-.5)*20,-50,1.2,7);
    if(tr.t<=0) tr.state=2;
  }
  if(Math.abs(cam.x-VOLC)<1500){
    const cy=ground(VOLC)-30, live=cellAt(VOLC,cy+8)===LAVA||cellAt(VOLC-30,cy+8)===LAVA||cellAt(VOLC+30,cy+8)===LAVA;
    if(live&&Math.random()<dt*5) spawn(0,VOLC+(Math.random()-.5)*90,cy,(Math.random()-.5)*20,-45-Math.random()*30,2.2,9+Math.random()*8);
    volT-=dt;
    if(volT<=0){
      volT=6+Math.random()*6;
      if(live) for(let i=0;i<10;i++) spawn(4,VOLC+(Math.random()-.5)*60,cy,(Math.random()-.5)*340,-380-Math.random()*220,2.4,4+Math.random()*3);
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.type===0||p.type===7){ p.vy-=20*dt; p.size+=9*dt; }
    else if(p.type===1) p.vy-=70*dt;
    else if(p.type===2) p.vy-=10*dt;
    else if(p.type===6){ p.vy+=G*.35*dt; p.vx-=p.vx*dt*1.5; }
    else if(p.type<8) p.vy+=G*.6*dt;
    else if(p.type===10) p.vy+=G*.45*dt;
    else if(p.type===12){ p.vy-=18*dt; p.size+=5*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type===4&&p.vy>0&&solidW(p.x,p.y)) p.life=0;
  }
  const vw=W/S, vh=H/S;
  /* Beim Schienenmalen schiebt der Finger am Bildrand die Kamera weiter, so lassen sich lange und hohe Bahnen in einem Zug malen. */
  const sp=strokeId!==null&&stroke?pointers.get(strokeId):null;
  if(sp){
    const v=330*dt, topS=Math.min(H*.4,150);
    if(sp.x<64) pan.x-=v; else if(sp.x>W-64) pan.x+=v;
    if(sp.y<topS+56) pan.y-=v; else if(sp.y>H-190) pan.y+=v;
    pan.x=clamp(pan.x,-3000,3000); pan.y=clamp(pan.y,-5200,1500);
    const w=toWorld(sp.x,sp.y), l=stroke[stroke.length-1];
    if(stroke.length<900&&Math.hypot(w[0]-l[0],w[1]-l[1])>10) stroke.push(w);
  }else{ pan.x-=pan.x*Math.min(1,dt*2.5); pan.y-=pan.y*Math.min(1,dt*2.5); }
  const tx=P.x+clamp(P.vx*.3,-110,110)+pan.x, ty=P.y-vh*.08-20+pan.y;
  cam.x+=(tx-cam.x)*Math.min(1,dt*4); cam.y+=(ty-cam.y)*Math.min(1,dt*5);
  if(vw<WORLD_W) cam.x=clamp(cam.x,vw/2,WORLD_W-vw/2);
}

/* ---------- Malen mit dem Finger ---------- */
const pointers=new Map();
function toWorld(sx,sy){ return [cam.x+(sx-W/2)/S, cam.y+(sy-H/2)/S]; }
function disc(cx,cy,r,m){
  const n=Math.ceil(r);
  for(let dy=-n;dy<=n;dy++) for(let dx=-n;dx<=n;dx++){
    if(dx*dx+dy*dy>r*r) continue;
    const x=cx+dx, y=cy+dy;
    if(inGrid(x,y)&&grid[y*GX+x]<4){ grid[y*GX+x]=m; life[y*GX+x]=0; }
  }
}
function erase(wx,wy){
  const cx=Math.floor(wx/CELL), cy=Math.floor((wy-TOP)/CELL);
  for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
    if(dx*dx+dy*dy>18) continue;
    const x=cx+dx, y=cy+dy;
    if(!inGrid(x,y)) continue;
    const m=grid[y*GX+x];
    if(m===LAVA||m===FIRE||m===WATER||m===ICE||m===WOOD||m===SNOW){ grid[y*GX+x]=0; life[y*GX+x]=0; }
  }
  props=props.filter(function(o){ return Math.abs(o.x-wx)>30||wy>o.y+10||wy<o.y-110; });
  for(let k=tracks.length-1;k>=0;k--){
    const T=tracks[k];
    if(wx<T.minX-20||wx>T.maxX+20) continue;
    for(let i=0;i<T.pts.length;i+=2){
      const p=T.pts[i];
      if(Math.abs(p[0]-wx)<18&&Math.abs(p[1]-wy)<18){
        if(P.mode==='coaster'&&P.track===T) setMode('walk');
        tracks.splice(k,1); break;
      }
    }
  }
}
function paintAt(wx,wy){
  const cx=Math.floor(wx/CELL), cy=Math.floor((wy-TOP)/CELL);
  if(tool==='lava'||tool==='water'){
    const t=tool==='lava'?LAVA:WATER;
    if(t===LAVA?lavaCount>=MAX_LAVA:waterCount>=MAX_WATER){ pulse('tool-erase'); return; }
    putUp(cx,cy,t);putUp(cx+1,cy,t);putUp(cx-1,cy,t);putUp(cx,cy-1,t);putUp(cx,cy+1,t);
    if(t===WATER){ putUp(cx+1,cy-1,t); putUp(cx-1,cy-1,t); }
  }
  else if(tool==='fire'){ putUp(cx,cy,FIRE); putUp(cx+1,cy,FIRE); }
  else if(tool==='earth') disc(cx,cy,1.7,EARTH);
  else if(tool==='ice') disc(cx,cy,2.3,ICE);
  else if(tool==='snow') disc(cx,cy,2.3,SNOW);
  else if(tool==='blocks') fillBlock(cx>>2,cy>>2);
  else if(tool==='erase') erase(wx,wy);
}
function paintStep(){
  if(!tool||tool==='track') return;
  pointers.forEach(function(p){
    const w=toWorld(p.x,p.y);
    if(tool==='tnt'){ if(!p.has){ p.has=true; dropBomb(w[0],w[1]); } return; }
    if(tool==='ball'||tool==='fw'){ if(!p.has||time-p.bt>(tool==='ball'?.28:.4)){ p.has=true; p.bt=time; if(tool==='ball') throwBall(w[0],w[1]); else firework(w[0],w[1]); } return; }
    if(tool==='man'){ if(!p.has){ p.has=true; addMan(w[0]); } return; }
    if(p.has){
      const dist=Math.hypot(w[0]-p.lx,w[1]-p.ly), n=Math.min(18,Math.max(1,Math.ceil(dist/CELL)));
      for(let k=1;k<=n;k++) paintAt(p.lx+(w[0]-p.lx)*k/n,p.ly+(w[1]-p.ly)*k/n);
    }else paintAt(w[0],w[1]);
    p.lx=w[0]; p.ly=w[1]; p.has=true;
  });
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,has:false,lx:0,ly:0});
  if(!tool) tapWorld(e.clientX,e.clientY);
  if(tool==='track'&&strokeId===null){
    const w=toWorld(e.clientX,e.clientY);
    strokeId=e.pointerId; strokeExt=null; stroke=[w];
    for(const T of tracks){
      const a=T.pts[0], b=T.pts[T.pts.length-1];
      if(Math.hypot(w[0]-b[0],w[1]-b[1])<46){ strokeExt={T:T,end:true}; stroke=[[b[0],b[1]]]; break; }
      if(Math.hypot(w[0]-a[0],w[1]-a[1])<46){ strokeExt={T:T,end:false}; stroke=[[a[0],a[1]]]; break; }
    }
  }
});
cv.addEventListener('pointermove',function(e){
  const p=pointers.get(e.pointerId); if(!p) return;
  p.x=e.clientX; p.y=e.clientY;
  if(e.pointerId===strokeId&&stroke&&stroke.length<900){
    const w=toWorld(p.x,p.y), l=stroke[stroke.length-1];
    if(Math.hypot(w[0]-l[0],w[1]-l[1])>10) stroke.push(w);
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(e.pointerId===strokeId){
    const ex=strokeExt, k=ex?tracks.indexOf(ex.T):-1;
    if(ex&&k>=0){
      if(stroke&&stroke.length>2){
        const add=stroke.slice(1);
        let raw=ex.end?ex.T.raw.concat(add):add.reverse().concat(ex.T.raw);
        if(raw.length>2600) raw=ex.end?raw.slice(raw.length-2600):raw.slice(0,2600);
        const N=makeTrack(raw,true);
        if(N){
          if(P.mode==='coaster'&&P.track===ex.T){ if(!ex.end) P.s+=N.len-ex.T.len; P.track=N; }
          tracks[k]=N; pulse('mode-coaster');
        }
      }
    }else{
      const T=makeTrack(stroke,true);
      if(T){ tracks.push(T); if(tracks.length>12) tracks.shift(); pulse('mode-coaster'); }
      else if(stroke&&stroke.length>1) pulse('tool-track');
    }
    stroke=null; strokeId=null; strokeExt=null;
  }
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);

/* ---------- Ton und Sprache ---------- */
let AC=null, talkLock=0, tapT=0;
function audio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ AC=null; } }
  if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(_){} }
}
function jingle(){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime;
    [523,659,784,1047].forEach(function(f,i){
      const o=AC.createOscillator(), g=AC.createGain(), s=t+i*.11;
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s); g.gain.linearRampToValueAtTime(.18,s+.02); g.gain.exponentialRampToValueAtTime(.001,s+.4);
      o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+.45);
    });
  }catch(_){}
}
function speak(text){
  try{
    if(performance.now()<talkLock&&performance.now()-tapT>450) return;
    if(muted||!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=.95; u.pitch=1.1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(_){}
}
let muted=false, noiseBuf=null, coinT=0, coinN=0, digSfxT=0, flameSfx=0;
try{ muted=localStorage.getItem('lavaland-mute')==='1'; }catch(_){}
function blip(f0,f1,dur,type,vol){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(_){}
}
function noise(dur,freq,vol){
  if(!AC||muted) return;
  try{
    if(!noiseBuf){ noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.6),AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const t=AC.currentTime, src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    src.buffer=noiseBuf; f.type='lowpass'; f.frequency.setValueAtTime(freq,t); f.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.3),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t); src.stop(t+dur+.02);
  }catch(_){}
}
/* Kurze Geräusche. Gold klingt mit jedem Stück in Folge etwas höher. */
function sfx(k){
  const now=performance.now();
  if(k==='coin'){ if(now-coinT<70) return; coinN=now-coinT<700?Math.min(12,coinN+1):0; coinT=now; const f=880*Math.pow(1.06,coinN); blip(f,f*1.5,.09,'triangle',.12); }
  else if(k==='dig'){ if(now-digSfxT<95) return; digSfxT=now; noise(.07,500+Math.random()*300,.16); }
  else if(k==='jump') blip(300,620,.12,'sine',.1);
  else if(k==='boom'){ noise(.55,900,.4); blip(120,40,.4,'sine',.3); }
  else if(k==='tick') blip(900,700,.03,'square',.03);
  else if(k==='pop') blip(520,880,.1,'triangle',.12);
  else if(k==='throw') blip(520,240,.09,'sine',.06);
  else if(k==='splat') noise(.09,1500,.12);
  else if(k==='swish') noise(.18,3200,.03);
  else if(k==='hick') blip(430,920,.08,'square',.05);
  else if(k==='laugh') tone([392,523,392,523]);
  else if(k==='pups'){ blip(150,52,.45,'sawtooth',.2); noise(.3,320,.1); }

function progress(){
  const d=task.data, id=task.id;

  if(id==='smash'){
    let n=0; for(const b of d.blocks) for(let y=b[1]*4;y<b[1]*4+4;y++) for(let x=b[0]*4;x<b[0]*4+4;x++) if(grid[y*GX+x]===WOOD) n++;
    return Math.min(1,(1-n/d.init)/.88);
  }
  if(id==='volcano'){
    let n=0; for(const i of d.plan.cone) if(grid[i]>=4) n++;
    const fill=n/d.plan.cone.length, y=siteY.volb;
    if(fill>=.8&&!d.stage2){ d.stage2=true; setTool('lava',true); setChipTool('lava'); pulse('tool-lava'); speak(task.def.say2); }
    const lv=d.stage2?boxCount(SITE.volb-100,SITE.volb+100,y-150,y-6,function(m){return m===LAVA;}):0;
    return .85*Math.min(1,fill/.8)+(lv>=6?.15:0);
  }
  if(id==='cool'){
    const n=boxCount(VOLC-125,VOLC+125,ground(VOLC-105)-60,ground(VOLC)+12,function(m,i){ return m===LAVA&&grid[i-GX]<4&&grid[i-GX]!==LAVA; });
    if(n>d.max) d.max=n;
    if(d.max<6||task.t<1) return 0;
    return n===0?1:Math.min(.95,1-n/d.max);
  }
  if(id==='park'){
    let has=false; for(const T of tracks) if(T.user&&T.len>=400) has=true;
    if(has&&!d.stage2){ d.stage2=true; setChipTool('coaster'); pulse('mode-coaster'); speak(task.def.say2); }
    return d.rode?1:(has?.5:0);
  }
  if(id==='fire'){
    const y=siteY.fire, n=boxCount(SITE.fire-70,SITE.fire+70,y-70,y+6,function(m,i){return m===FIRE&&life[i]===255;});
    return 1-Math.min(1,n/d.init);
  }
  if(id==='ice'){
    let ice=0;
    const all=boxCount(SITE.pond-170,SITE.pond+170,siteY.pond+4,siteY.pond+80,function(m){ if(m===ICE) ice++; return m===ICE||m===WATER; });
    return all<60?0:Math.min(1,(ice/all)/.7);
  }
  if(id==='moon') return (P.on&&P.y<-3000&&P.mode!=='coaster')?1:clamp(-P.y/4800,0,.9);
  if(id==='treasure'){
    if(chest&&chest.open) return 1;
    const dist=chest?Math.hypot(P.x-chest.x,P.y-12-chest.y):d.far;
    return clamp(1-(dist-30)/(d.far-30),0,.9);
  }
  return 0;
}

function placeFind(zone,r){

    for(let k=0;k<40;k++){

      if(ok) return x;
    }
    return 2000+r()*300;
  };
  let x, y;
  if(zone==='shallow'){ x=anyX(); return [x,ground(x)+50+r()*90,r()<.6]; }
  if(zone==='deep'){ x=anyX(); return [x,ground(x)+330+r()*600,r()<.3]; }
  if(zone==='deeper'){ x=200+r()*(HOME_W-400); return [x,1250+r()*1000,false]; }
  if(zone==='hot'){ x=200+r()*(HOME_W-400); return [x,2470+r()*330,false]; }

    for(let k=0;k<300;k++){

    }

  if(zone==='lake'){ x=830+r()*220; return [x,TOP+colTop(Math.floor(x/CELL),Math.floor((ground(700)+235-TOP)/CELL))*CELL-10,false]; }
  if(zone==='pond'){ x=SITE.pond+(r()-.5)*120; return [x,TOP+colTop(Math.floor(x/CELL),Math.floor((siteY.pond-30-TOP)/CELL))*CELL-10,false]; }
  if(zone==='tree'){
    const cand=[]; trees.forEach(function(t,i){ if(t.state===0&&i<NT0) cand.push(i); });
    if(!cand.length) return null;
    const i=cand[Math.floor(r()*cand.length)], t=trees[i];
    return [t.x,t.gy-t.h-4,false,i];

  if(zone==='house'){ const k=grow0[Math.floor(SITE.smash/CELL)]>>2, b0=Math.round(SITE.smash/24)-2; return [(b0+3)*24+12,TOP+(k-2)*24+12,false]; }

}

  else if(type==='deep') q.goal=[800,1500,2300][ri(0,2)];
  else if(type==='high') q.goal=4000;
  else if(type==='ski') q.goal=1500+500*Math.min(tier,4);
  else if(type==='salto') q.goal=1+Math.min(tier,3);
  else if(type==='poke') q.goal=3+Math.min(tier,4);
  else if(type==='pz') q.goal=1+Math.min(tier,2);
  else if(type==='mat') q.goal=2+Math.min(tier,3);
  return q;
}
/* Für einen Such-Auftrag wird ein noch fehlender Fund glitzernd in die Nähe gelegt, damit er sicher zu schaffen ist. */
function prepFind(){
  let h=null;
  for(const q of hidden) if(!q.got&&(q.zone==='shallow'||q.zone==='deep'||q.zone==='deeper'||q.zone==='hot')){ h=q; if(q.zone==='shallow') break; }
  if(!h) return;
  if(h.hint&&h.zone==='shallow'&&Math.abs(h.x-P.x)<700) return;
  const offs=[170,-170,260,-260,360,-360,480,-480];
  for(const o of offs){
    const x=P.x+o;
    if(x<120||x>WORLD_W-120||Math.abs(x-VOLC)<560||Math.abs(x-STALL_X)<70) continue;
    const gy=ground(x);
    if(Math.abs(surfaceY(x)-gy)>14||!solidW(x,gy+58)) continue;
    h.zone='shallow'; h.x=x; h.y=gy+58; h.hint=true; h.tree=-1;
    return;
  }
}
function showQuest(talk){
  quest=hero.quest;
  if(quest.type==='find'&&!quest.prep){ quest.prep=true; prepFind(); }
  const d=QDEF[quest.type];
  $('q-ic').innerHTML=d.ic(quest); $('quest').classList.remove('done'); qShown=''; renderQuest();
  if(talk){ speak(d.say(quest)); pulse(d.hint(quest)); pulse('quest'); }
}
function renderQuest(){
  if(!quest) return;
  const v=Math.min(quest.goal,Math.max(0,Math.floor(quest.p))), txt=v+'/'+quest.goal;
  if(txt===qShown) return;
  qShown=txt;
  $('q-txt').textContent=quest.goal>1?txt:''; $('q-bar').style.width=Math.round(v/quest.goal*100)+'%';
}
function questTick(dt){
  if(!quest) return;
  if(quest.done){
    qDoneT-=dt;
    if(qDoneT<=0){ hero.quest=newQuest(); saveHero(); showQuest(true); }
    return;
  }
  const t=quest.type;
  if(t==='deep') quest.p=Math.max(quest.p,P.y);
  else if(t==='high') quest.p=Math.max(quest.p,-P.y);
  else if(t==='moon'){ if(P.on&&P.y<-3000&&P.mode!=='coaster') quest.p=1; }
  else if(t==='drive'){ if(P.mode===quest.veh&&P.on) quest.p+=Math.abs(P.vx)*dt; }
  else if(t==='ski'){ if(P.mode==='ski'&&P.on&&P.ball<=0&&onSnow()) quest.p+=Math.abs(P.vx)*dt; }
  renderQuest();
  if(quest.p>=quest.goal){
    const g=10+2*Math.min(hero.qn,15), m=hero.qn%3===2?3:0;
    quest.done=true; qDoneT=2.3; hero.qn++; gold+=g; gems+=m; lootDirty=true;
    $('q-bar').style.width='100%'; $('quest').classList.add('done');
    banner('<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" stroke="#2f8f4a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>+'+g+COIN+(m?' +'+m+GEMI:''),2100);
    confetti(P.x,P.y); jingle(); speak('Auftrag geschafft!'); addXp(25); saveHero();
  }
}
function questPoint(){
  if(!quest||quest.done) return null;
  if(quest.type==='buy') return [STALL_X,ground(STALL_X)-70];
  if(quest.type==='pz'){ const m=nextMach(); return m?[m.x,m.y-52]:null; }
  if(quest.type==='moon') return [MOON.x,MOON.y-MOON.r-26];
  if((quest.type==='ski'||quest.type==='salto')&&P.x<5500) return [LIFT0,surfaceY(LIFT0)-84];
  if(quest.type==='land'||quest.type==='egg'){ const b=quest.type==='land'?nextLand():eggLand(); return b?[b.x0+240,ground(b.x0+240)-70]:null; }
  if(quest.type==='find'){
    let b=null, bd=1e9;
    for(const h of hidden){ if(h.got) continue; const d=Math.hypot(h.x-P.x,h.y-P.y)*(h.hint?1:3); if(d<bd){bd=d;b=h;} }
    return b?[b.x,b.y]:null;
  }
  return null;
}

/* ---------- Winter: Ski, Lift, Schneebälle, Schneemänner, Pinguine, Feuerwerk, Drachenflug und die Geschichte vom Hick im Berg ---------- */
const FLX=5892, HAREX=6885, YETX=7052, IGX=7128, LIFT0=5790, LIFT1=6935, PENX=5952, RIMY=Math.min(ground(VOLC-92),ground(VOLC+92));
const balls=[], fws=[], stq=[], FLK=[];

/* Erzählen: Der Text wird vorgelesen und steht zum Mitlesen unten im Bild. Solange erzählt wird, schweigen die anderen Ansagen. */
function say(who,text){

/* ---------- Lift ---------- */
function nearLift(){ return (P.mode==='walk'||P.mode==='ski')&&P.on&&P.ball<=0&&Math.abs(P.x-LIFT0)<48&&Math.abs(P.y-surfaceY(LIFT0))<60; }
function rideLift(){
  need(function(){ P.back=P.mode==='ski'; P.mode='coaster'; P.track=LIFT; P.s=0; P.v=220; P.on=false; P.chute=false; P.spin=0; P.rot=0; syncUI(); sfx('pop'); });
}
function liftRide(dt){
  P.s+=220*dt;
  const q=trackAt(LIFT,P.s);
  P.x=q.x; P.y=q.y+46; P.vx=q.tx*220; P.vy=q.ty*220; P.ang=0; P.face=1;
  if(P.s>=LIFT.len){ P.mode=P.back?'ski':'walk'; P.on=false; P.air=0; P.vx=60; P.vy=0; P.chute=false; syncUI(); }
}

/* Unter den Füßen liegt Schnee oder Eis. Zwei Tiefen, weil der Boden am Hang zwischen zwei Zellen liegt. */
function onSnow(){ const a=cellAt(P.x,P.y+3), b=cellAt(P.x,P.y+9); return a===SNOW||a===ICE||b===SNOW||b===ICE; }
/* ---------- Ski: ◀ ▶ anschieben, ▼ bremsen, ▲ Düse, rote Taste springt und macht in der Luft einen Salto ---------- */
function updSki(dt,ix,u,d){
  if(P.ball>0){ updRoll(dt); return; }
  const snow=onSnow(), gk=hero.own.goldski?1:0;
  if(ix) P.face=ix;
  if(u){
    P.vy+=(-230*(1+.25*hero.up.jet)-P.vy)*Math.min(1,dt*6); P.on=false; P.jet=true;
    if(Math.random()<dt*40) spawn(1,P.x-P.face*8,P.y-14,(Math.random()-.5)*30,130,.25,4);
  }
  if(P.on){
    const gs=P.gs, v=Math.abs(P.vx);
    P.vx+=G*gs/(1+gs*gs)*dt*(snow?1:.3);
    /* Unten im Auslauf liegt tiefer Schnee: Er bremst, damit man neben dem Lift zum Stehen kommt. */
    P.vx-=P.vx*Math.min(1,dt*((d?(snow?2.6:5):(snow?.15-.05*gk:2.8))+(P.vx<0&&P.x<6060&&P.x>5700?1.9:0)));
    if(ix&&P.vx*ix<190+25*hero.up.motor+50*gk) P.vx+=ix*(snow?320:200)*dt;
    P.vx=clamp(P.vx,-820,820);
    if(snow){
      if(v>90&&Math.random()<dt*(d?40:v*.03)) spawn(10,P.x-P.face*12,P.y-2,-P.vx*.2+(Math.random()-.5)*40,-30-Math.random()*(d?130:60),.4,2+Math.random()*2.5);
      if(v>220){ swishT-=dt; if(swishT<=0){ swishT=.3; sfx('swish'); } }
      if(gk&&v>200&&Math.random()<dt*14) spawn(5,P.x-P.face*14,P.y-3,0,-30,.5,2);
    }
  }else{
    if(!u) P.vy=Math.min(P.vy+grav()*dt,780);
    P.vx+=ix*60*dt;
    if(P.spin){ const st=Math.sign(P.spin)*Math.min(Math.abs(P.spin),10.5*dt); P.ang+=st; P.spin-=st; P.rot+=Math.abs(st); }
  }
  const pv=P.vy, wasAir=P.air;
  if(mover(dt,6,30,18,10)){ if(Math.abs(P.vx)>150) puff(P.x+P.face*8,P.y-12,6); P.vx*=-.25; }
  if(P.on){
    if(P.landed){
      if(Math.abs(P.spin)>.9){ P.ball=1.7; shout(P.x,P.y-52,'PLUMPS!'); sfx('splat'); puff(P.x,P.y-8,12); }
      else{
        const n=Math.round(P.rot/TAU);
        if(n>0){ shout(P.x,P.y-54,n>1?n+' × SALTO!':'SALTO!','#ffd23f'); gold+=n; popG+=n; lootDirty=true; addXp(2*n); sfx('pop'); qEvent('salto',n); }
        else if(wasAir>1&&!P.jet) shout(P.x,P.y-54,'JUHU!');
        if(pv>260) puff(P.x,P.y-2,7);
        P.ang=Math.atan(P.gs);
      }
      P.spin=0; P.rot=0; P.jet=false;
    }
    P.air=0; P.vy=P.gs*P.vx;
    if(P.ball<=0) P.ang+=(Math.atan(P.gs)-P.ang)*Math.min(1,dt*14);
    /* Wer an einer Tanne vorbeisaust, schüttelt den Schnee herunter. */
    if(Math.abs(P.vx)>120) for(const tr of trees) if(tr.fir&&tr.state===0&&Math.abs(tr.x-P.x)<9&&Math.abs(tr.gy-P.y)<40&&!(tr.sh>time)){ tr.sh=time+1.5; puff(tr.x,tr.gy-tr.h*.7,12); }
  }else P.air+=dt;
}
/* Mitten im Salto gelandet: Der Held kugelt als Schneeball weiter und plumpst dann wieder heraus. */
function updRoll(dt){
  P.ball-=dt;
  if(P.on){ const gs=P.gs; P.vx+=G*gs/(1+gs*gs)*dt; P.vx-=P.vx*Math.min(1,dt*(onSnow()?.5:3)); }
  else P.vy=Math.min(P.vy+grav()*dt,780);
  if(mover(dt,9,26,18,8)) P.vx*=-.4;
  if(P.on) P.vy=P.gs*P.vx;
  P.ang+=P.vx/16*dt;
  if(Math.random()<dt*14) puff(P.x,P.y-4,1);
  if(P.ball<=0){ P.ball=0; P.ang=0; P.spin=0; P.rot=0; puff(P.x,P.y-14,16); shout(P.x,P.y-50,'PLOPP!'); sfx('pop'); P.vy=-190; P.on=false; }
}
function skiAct(){
  if(P.ball>0) return;
  if(nearLift()){ rideLift(); return; }
  if(P.on){ P.vy-=350; P.y-=3; P.on=false; P.air=0; P.jet=false; sfx('jump'); }
  else if(Math.abs(P.spin)<TAU*1.5){ P.spin+=(P.vx>=0?-1:1)*TAU; sfx('whoosh'); }
}

/* ---------- Drachenflug auf Mama Glut: fliegt frei in alle Richtungen, die rote Taste spuckt Feuer und schmilzt Schnee ---------- */
function updDragon(dt,ix,u,d){
  if(ix) P.face=ix;
  P.vx+=(ix*310*(1+.15*hero.up.jet)-P.vx)*Math.min(1,dt*3);
  if(P.on&&!u) P.vy=Math.min(P.vy+grav()*dt,300);
  else P.vy+=((d-u)*270+((u||d||reduced)?0:16*Math.sin(time*3))-P.vy)*Math.min(1,dt*4);
  if(u&&P.on){ P.on=false; P.y-=3; }
  if(mover(dt,24,58,22,16)) P.vx*=-.2;
  if(P.on) P.vy=0;
  P.ang+=(clamp(P.vy/500,-.35,.35)*P.face-P.ang)*Math.min(1,dt*6);
  if(keys.a){ P.digT-=dt; if(P.digT<=0){ P.digT=.05; breathe(); } }
}
function melt(cx,cy){
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    if(dx*dx+dy*dy>5) continue;
    const x=cx+dx, y=cy+dy; if(!inGrid(x,y)) continue;
    const i=y*GX+x;
    if(grid[i]===SNOW||grid[i]===ICE){ grid[i]=0; steam(x,y); }
  }
}
function breathe(){
  const mx=P.x+P.face*62, my=P.y-63;
  for(let k=0;k<2;k++) spawn(1,mx,my,P.face*(300+Math.random()*160)+P.vx,(Math.random()-.3)*120+P.vy*.5,.35+Math.random()*.2,7+Math.random()*6);
  sfx('flame');
  for(let r=20;r<=170;r+=12){
    const x=mx+P.face*r, y=my+r*.24, cx=Math.floor(x/CELL), cy=Math.floor((y-TOP)/CELL);
    if(!inGrid(cx,cy)) break;
    const m=grid[cy*GX+cx];
    if(m===SNOW||m===ICE){ melt(cx,cy); break; }
    if(m===WATER){ steam(cx,cy); break; }
    if(m>=4){ if(Math.random()<.5) putUp(cx-P.face,cy,FIRE); break; }
  }
}

/* ---------- Schneebälle ---------- */
function throwBall(tx,ty,from){

  const sx=from?from[0]:P.x+P.face*6, sy=from?from[1]:P.y-30, dx=tx-sx, dy=ty-sy, T=clamp(Math.hypot(dx,dy)/520,.3,.95);
  balls.push({x:sx,y:sy,vx:dx/T,vy:dy/T-300*T,foe:!!from,t:0});

}
function npcHit(b){
  const y=N.yeti, fx=flX(), h=N.hare;

  if(Math.abs(b.x-fx)<13&&b.y>surfaceY(fx)-58&&b.y<surfaceY(fx)){ shout(fx,surfaceY(fx)-72,'HEY!'); return true; }
  if(Math.abs(b.x-h.x)<12&&Math.abs(b.y-(h.y-10))<14){ shout(h.x,h.y-36,'MIEP!'); sfx('quack'); return true; }
  return false;
}
function ballsTick(dt){

      if(b.foe){ if(P.mode!=='coaster'&&Math.hypot(b.x-P.x,b.y-(P.y-20))<20){ hit=true; P.frost=2.5; shout(P.x,P.y-56,'PLATSCH!'); } }

/* ---------- Pinguine: Sie stehen unten an der Piste wie Kegel. Wer hineinsaust, lässt sie fliegen. ---------- */
function pinFly(p,vx){

}
function pensTick(dt){
  for(const p of N.pen){
    if(p.s===0){
      p.x=p.hx; p.y=surfaceY(p.hx); p.rot=0;
      if(partyT<=0&&P.mode!=='coaster'&&Math.abs(P.x-p.x)<13&&P.y>p.y-26&&P.y<p.y+34&&Math.abs(P.vx)>110) pinFly(p,P.vx*.7);
    }else if(p.s===1){

    /* Wer auf dem alten Erdkern stand, steht jetzt knapp über der neuen harten Schicht. */

    const lim=genF*CELL-300;
    if(P.x>lim){ P.x=820; P.y=surfaceY(820)-2; }

  if(mhT<=0){ mhT=.6; const lim=(genF-8)*CELL; for(const m of MACH) if(m.sf&&m.x<lim) m.y=surfaceY(m.x); }
  if(P.mode!=='coaster'){
    const z=zoneAt(P.x,P.y-12);
    if(z>hero.zn){
      hero.zn=z; saveHero(); jingle(); confetti(P.x,P.y); addXp(30); banner(ZN[z].e+' ⭐',2400);
      say('','Du hast '+ZN[z].n+' erreicht! Der Aufzug zu Hause fährt jetzt bis hierher.');
    }
  }
  const pts=[[P.x,P.y-16]];
  if(P.mode==='bagger') pts.push(bucket()); else if(P.mode==='loader') pts.push(scoop()); else if(P.mode==='tbm') pts.push(drillHead());
  for(const m of MATS){
    if(matGot[m.id]||Math.abs(m.x-P.x)>260||Math.abs(m.y-P.y)>260) continue;
    for(const q of pts) if(Math.hypot(q[0]-m.x,q[1]-m.y)<30){ matFound(m); break; }
  }
  if(P.on&&P.y<-6000&&SPACE.gate){
    for(const k of ['stn','ice','jun']){
      const o=SPACE[k];
      if(orbGot[k]||Math.hypot(P.x-o.x,P.y-o.y)>o.r+40) continue;
      orbGot[k]=1; gold+=30; lootDirty=true; confetti(P.x,P.y); jingle(); banner('⭐ +30'+COIN,2400);
      say('',k==='stn'?'Du bist auf der Raumstation gelandet! Auf den großen Felsbrocken ringsum liegt Sternenerz.':k==='ice'?'Du bist auf dem Eisplaneten gelandet! Hier liegen Eiskerne.':'Du bist auf dem Blubberplaneten gelandet! Hier wohnt Blubb.');
    }
    if(!(hero.fin&1)&&Math.hypot(P.x-SPACE.gate.x,P.y-SPACE.gate.y)<SPACE.gate.r+40) finale(1);
  }
  if(!(hero.fin&2)&&P.y>9000&&cellAt(P.x,P.y+3)===CORE) finale(2);
  if(!hero.deep&&performance.now()>talkLock&&Math.abs(P.x-WSX)<110&&Math.abs(P.y-ground(WSX))<90) deepIntro();
  if(guide&&time>guide.t) guide=null;
}
function nextMach(){
  let b=null, bd=1e12; const lim=(genF-8)*CELL;
  for(const m of MACH){
    if(pzGot[m.id]||m.y!==m.y||m.x>lim) continue;
    const d=Math.abs(m.x-P.x)+2.5*Math.abs(m.y-P.y);
    if(d<bd){ bd=d; b=m; }
  }
  return b;
}
function nearMach(){ for(const m of MACH) if(m.y===m.y&&Math.abs(P.x-m.x)<34&&Math.abs(P.y-m.y)<52) return m; return null; }
function nearCab(){ if(Math.abs(P.x-LIFTX)>46) return -1; for(let k=0;k<ZN.length;k++) if(Math.abs(P.y-stationY(k))<64) return k; return -1; }
function atLab(){ return Math.abs(P.x-WSX)<110&&Math.abs(P.y-ground(WSX))<120; }
function deepIcon(){ if(!P.on) return ''; return nearMach()?'pz':nearCab()>=0?'lift':Math.abs(P.x-WSX)<44&&Math.abs(P.y-ground(WSX))<60?'lab':''; }
function deepAct(){
  if(!P.on) return false;
  const m=nearMach();
  if(m){ pzOpen(m); return true; }
  if(nearCab()>=0){ openMine(); return true; }
  if(Math.abs(P.x-WSX)<44&&Math.abs(P.y-ground(WSX))<60){ openLab(); return true; }
  return false;
}
function deepTap(wx,wy){
  const gy=ground(WSX);
  if(Math.abs(wx-WSX)<60&&wy>gy-100&&wy<gy+8&&Math.abs(cam.y-gy)<700){ openLab(); return true; }
  if(Math.abs(wx-LIFTX)<34) for(let k=0;k<ZN.length;k++){
    const y=stationY(k);
    if(wy<y-(k?58:112)||wy>y+8) continue;
    if(Math.hypot(P.x-LIFTX,P.y-y)<190) openMine(); else say('','Geh erst zum Aufzug hin.');
    return true;
  }
  for(const m of MACH){
    if(m.y!==m.y||Math.abs(wx-m.x)>28||wy<m.y-74||wy>m.y+8) continue;
    if(Math.hypot(P.x-m.x,P.y-m.y)<360) pzOpen(m); else say('','Geh erst näher an die Rätselmaschine heran.');
    return true;
  }
  return false;
}
/* Pfeil zu dem Ort, an dem es ein Material gibt. Erst in der richtigen Zone zeigt er auf das nächste Stück. */
function matWhere(k){
  if(k==='zr'){ const m=nextMach(); return m?[m.x,m.y-52]:null; }
  if(k==='lab') return [WSX,ground(WSX)-96];
  if(k==='mo'||k==='st'||k==='ei'){
    const o=k==='mo'?MOON:k==='st'?SPACE.stn:SPACE.ice;
    if(o&&Math.hypot(P.x-o.x,P.y-o.y)>o.r+(k==='st'?2600:700)) return [o.x,o.y-o.r-30];
  }else if(zoneAt(P.x,P.y)<MATZ[k]){
    const gy=ground(LIFTX);
    return hero.zn>=MATZ[k]&&Math.abs(P.y-gy)<500?[LIFTX,gy-110]:[P.x,P.y+400];
  }
  let b=null, bd=1e12;
  for(const m of MATS){ if(m.k!==k||matGot[m.id]) continue; const d=Math.hypot(m.x-P.x,m.y-P.y); if(d<bd){ bd=d; b=m; } }
  return b?[b.x,b.y]:null;
}
function guidePoint(){ return guide?matWhere(guide.k):null; }

/* ---------- Werkstatt ---------- */
function missing(g){
  const t=hero[g]|0, rc=GEAR[g].rc[t], out=[];
  for(const k in rc){ const d=rc[k]-(hero.mat[k]|0); if(d>0) out.push(d+' '+MAT[k][d>1?2:1]); }
  return out.length>1?out.slice(0,-1).join(', ')+' und '+out[out.length-1]:out[0]||'';
}

  }

function openLab(){
  renderLab(); $('lab').hidden=false; talkLock=0;
  if(!hero.deep){ hero.deep=true; saveHero(); speak('Das ist die Werkstatt von Professor Zahnrad. Hier siehst du, was du für einen besseren Bohrer, eine stärkere Rakete und eine hellere Lampe brauchst. Tippe auf ein Bild, dann sage ich dir, wo du es findest.'); }
}
function labBuild(g){
  const G=GEAR[g], t=hero[g]|0;
  if(t>=3){ speak(G.n+' ist schon ganz fertig.'); return; }
  if(!canBuild(g)){ tone([170],'sawtooth'); speak('Für '+G.art+' fehlen noch '+missing(g)+'. Tippe auf ein Bild, dann sage ich dir, wo du es findest.'); return; }
  if(!atLab()){ tone([170],'sawtooth'); guide={k:'lab',t:time+120}; speak('Du hast alles zusammen! Bauen kann aber nur Professor Zahnrad. Komm zur Werkstatt. Sie steht zu Hause neben dem Markt.'); return; }
  const rc=G.rc[t];
  for(const k in rc) hero.mat[k]-=rc[k];
  hero[g]=t+1; saveHero(); guide=null;
  $('lab').hidden=true; confetti(P.x,P.y); jingle(); addXp(40);
  banner(G.e+' '+'●'.repeat(t+1)+'○'.repeat(2-t),2600);
  say('Professor Zahnrad',G.done[t]);
  labBadge(false);
}
$('lab').addEventListener('click',function(e){

  if(b){ const k=b.dataset.mat; guide={k:k,t:time+300}; speak(MAT[k][1]+'. Du hast '+(hero.mat[k]|0)+'. '+MAT[k][3]+' Der orange Pfeil zeigt dir den Weg.'); return; }

  if(b){ const g=b.dataset.tl, G=GEAR[g], t=hero[g]|0; speak(t>=3?G.n+' ist ganz fertig.':G.n+', Stufe '+(t+1)+'. '+G.what[t]+(canBuild(g)?' Du hast alles dafür. Tippe auf den Hammer.':' Dafür fehlen noch '+missing(g)+'.')); return; }

});

/* ---------- Aufzug: fährt zu jeder Zone, die man selbst schon erreicht hat. Bodenfahrzeuge fahren mit. ---------- */

  const cur=nearCab(); let h='';
  for(let k=0;k<ZN.length;k++){

    h+='<button class="card place'+(k===cur?' cur':'')+(ok?'':' shut')+'" data-st="'+k+'" aria-label="'+(ok?'Fahre in '+ZN[k].n:'Noch verschlossen: '+ZN[k].n)+'"><span aria-hidden="true">'+(ok?ZN[k].e:'🔒')+'</span>'+(ok?'':'<small aria-hidden="true">'+ZN[k].e+'</small>')+'</button>';

}
function openMine(){ if(liftBusy) return; renderMine(); $('mine').hidden=false; talkLock=0; speak('Wohin soll der Aufzug fahren?'); }
function liftGo(k){
  if(liftBusy) return;
  const f=$('fade'), m=P.mode;
  if(m!=='walk'&&m!=='car'&&m!=='bagger'&&m!=='loader'&&m!=='dumper'&&m!=='tbm') setMode('walk');
  liftBusy=true; f.hidden=false; void f.offsetWidth; f.classList.add('on'); sfx('whoosh');
  setTimeout(function(){
    P.x=LIFTX; P.y=stationY(k)-2; P.vx=0; P.vy=0; P.on=false; P.chute=false; P.ang=0;
    cam.x=P.x; cam.y=P.y-80; dkA=darkAt(cam.y); scanMobile();
    f.classList.remove('on');
    setTimeout(function(){ f.hidden=true; liftBusy=false; },380);

}
$('mine-cards').addEventListener('click',function(e){

  ctx.strokeStyle='rgba(250,240,214,.8)'; ctx.fillStyle='rgba(250,240,214,.8)'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
  if(d.v===0){
    ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(20,0);

    ctx.moveTo(-26,0); ctx.lineTo(-34,-7); ctx.moveTo(-26,0); ctx.lineTo(-34,7); ctx.stroke(); circle(26,0,6);
  }else if(d.v===1){

function drawDeep(x0,x1,y0,y1){
  const gy=ground(WSX);
  if(WSX>x0-80&&WSX<x1+80&&gy>y0-10&&gy<y1+100) drawLab();
  if(LIFTX>x0-50&&LIFTX<x1+50) for(let k=0;k<ZN.length;k++){ const y=stationY(k); if(y>y0-10&&y<y1+120) drawCab(LIFTX,y,k===0); }
  for(const d of ZDEC) if(d.x>x0-60&&d.x<x1+60&&d.y>y0-60&&d.y<y1+60){ if(d.k==='bone') drawBone(d); else drawCry(d); }
  for(const m of MACH) if(m.y===m.y&&m.x>x0-30&&m.x<x1+30&&m.y>y0-10&&m.y<y1+90) drawMach(m);
  for(const m of MATS) if(!matGot[m.id]&&m.x>x0-20&&m.x<x1+20&&m.y>y0-20&&m.y<y1+20) drawMat(m);
}
/* Unter der Erde wird es dunkel. Die Lampe und alles, was leuchtet, machen helle Flecken. Ganz schwarz wird es nie. */
function darkAt(y){
  if(hero.lp>=3) return 0;
  const d=y-900;
  if(d<=0) return 0;
  return d<1700?.46*d/1700:.46+.3*Math.min(1,(d-1700)/1500);
}
function drawDark(){
  dkA+=(darkAt(cam.y)-dkA)*.08;
  if(dkA<.02) return;
  const q=4, w=Math.ceil(W/q), h=Math.ceil(H/q);
  if(dkc.width!==w||dkc.height!==h){ dkc.width=w; dkc.height=h; }
  dkx.globalCompositeOperation='source-over'; dkx.clearRect(0,0,w,h);
  dkx.fillStyle='rgba(6,8,22,'+dkA.toFixed(3)+')'; dkx.fillRect(0,0,w,h);
  dkx.globalCompositeOperation='destination-out';
  const hole=function(wx,wy,r,k){
    const sx=((wx-cam.x)*S+W/2)/q, sy=((wy-cam.y)*S+H/2)/q, rd=r*S/q;
    if(sx<-rd||sx>w+rd||sy<-rd||sy>h+rd) return;
    const g=dkx.createRadialGradient(sx,sy,rd*.3,sx,sy,rd);
    g.addColorStop(0,'rgba(0,0,0,'+k+')'); g.addColorStop(1,'rgba(0,0,0,0)');
    dkx.fillStyle=g; dkx.fillRect(sx-rd,sy-rd,2*rd,2*rd);
  };
  hole(P.x,P.y-20,[135,195,275,400][hero.lp|0],1);
  const vw=W/S+200, vh=H/S+200;
  for(const m of MATS) if(!matGot[m.id]&&Math.abs(m.x-cam.x)<vw&&Math.abs(m.y-cam.y)<vh) hole(m.x,m.y,46,.75);
  for(const m of MACH) if(m.y===m.y&&Math.abs(m.x-cam.x)<vw&&Math.abs(m.y-cam.y)<vh) hole(m.x,m.y-30,90,.9);
  for(const p of PADS) if(p.y>900&&Math.abs(p.x-cam.x)<vw&&Math.abs(p.y-cam.y)<vh) hole(p.x,p.y,80,.8);
  for(const d of ZDEC) if(d.k==='cry'&&Math.abs(d.x-cam.x)<vw&&Math.abs(d.y-cam.y)<vh) hole(d.x,d.y-20,100,.8);
  if(Math.abs(LIFTX-cam.x)<vw) for(let k=1;k<ZN.length;k++) if(Math.abs(ZN[k].y-cam.y)<vh) hole(LIFTX,ZN[k].y-30,150,.95);
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0); ctx.imageSmoothingEnabled=true;
  ctx.drawImage(dkc,0,0,w,h,0,0,W,H);

function tkKey(t){ return t.n!==undefined?'n'+t.n:t.s+'-'+t.c; }

function mkMuster(lv){
  const sh=shuffle([0,1,2,3,4]), co=shuffle([0,1,2,3,4,5]), T=[0,1,2,3].map(function(i){ return {s:sh[i],c:co[i]}; });
  const st={k:'rep',seq:[],hole:0,opts:[],ans:''};
  let unit=null, len=6, mid=false;
  if(lv===0){ unit=[0,1]; len=6; }
  else if(lv===1){ unit=ri(0,1)?[0,0,1]:[0,1,1]; len=7; }
  else if(lv===2){ unit=[0,1,2]; len=7; }
  else if(lv===3){ unit=[[0,1],[0,0,1],[0,1,2]][ri(0,2)]; len=8; mid=true; }
  else if(lv===4){ unit=ri(0,1)?[0,0,1,1]:[0,1,0,2]; len=9; mid=ri(0,1)===1; }
  else if(lv===5||lv===7){
    /* Zahlenreihe: immer gleich viel dazu oder weg */
    const step=lv===5?1:ri(2,3), down=lv===7&&ri(0,1)===1, a=down?step*4+ri(1,6):ri(1,5);
    st.k='cnt'; for(let i=0;i<5;i++) st.seq.push({n:down?a-i*step:a+i*step});
    st.hole=lv===5?4:ri(2,4);
  }else{
    /* Zwei Merkmale: Die Form wechselt in einem Takt, die Farbe in einem anderen. */
    const ps=lv===9?3:2, pc=lv===9?2:3;
    st.k='two'; len=lv===6?7:9;
    for(let i=0;i<len;i++) st.seq.push({s:sh[i%ps],c:co[i%pc]});
    st.hole=lv===6?len-1:ri(4,len-2);

  if(unit){ for(let i=0;i<len;i++) st.seq.push(T[unit[i%unit.length]]); st.hole=mid?ri(2,len-3):len-1; }

    const set=[ans.n];
    for(const v of shuffle([ans.n-1,ans.n+1,ans.n+2,ans.n-2,ans.n+3])) if(set.length<4&&v>0&&set.indexOf(v)<0) set.push(v);
    opts=set.map(function(n){ return {n:n}; });

    opts=[ans,{s:ans.s,c:oc},{s:os,c:ans.c},{s:os,c:oc}];
  }else{

}

/* ---------- 3. Roboter: eine Folge von Pfeilen planen, dann läuft der Roboter sie ab. ---------- */
const RBL=[[4,3,1,0,0,9],[4,4,3,0,0,9],[5,4,5,0,0,9],[5,5,7,0,0,9],[5,5,6,1,0,9],[6,5,8,1,2,9],[6,5,8,2,2,2],[6,6,10,2,3,1],[7,6,12,3,4,1],[7,6,14,3,5,0]];
const RBD=[[1,0],[0,1],[-1,0],[0,-1]], ARW=['➡️','⬇️','⬅️','⬆️'];
/* Sucht den Weg mit den wenigsten Richtungswechseln: erst alle Edelsteine, dann zur Fahne. */
function rbSolve(st){
  const w=st.w, h=st.h, n=w*h, G=st.gems, full=(1<<G.length)-1;
  const dist=new Int16Array(n*40).fill(999), prev=new Int32Array(n*40).fill(-1), k0=(st.s*5+4)*8, dq=[k0];
  let end=-1; dist[k0]=0;
  while(dq.length){
    const k=dq.shift(), m=k&7, pd=k>>3, d=pd%5, p=(pd-d)/5;
    if(p===st.g&&m===full){ end=k; break; }
    const x=p%w, y=(p-x)/w;
    for(let nd=0;nd<4;nd++){
      const nx=x+RBD[nd][0], ny=y+RBD[nd][1];
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const np=ny*w+nx;
      if(st.wall.has(np)||st.lava.has(np)) continue;
      const gi=G.indexOf(np), nm=gi>=0?m|(1<<gi):m, c=dist[k]+(nd===d?0:1), nk=(np*5+nd)*8+nm;
      if(c<dist[nk]){ dist[nk]=c; prev[nk]=k; if(nd===d) dq.unshift(nk); else dq.push(nk); }
    }
  }
  if(end<0) return null;

/* ---------- 4. Waage: beide Seiten gleich schwer machen oder herausfinden, wie schwer das Geschenk ist. ---------- */
function mkWaage(lv){
  const st={L:[],R:[],pal:null,items:null,box:0,opts:null,over:false,ang:0};
  const pick=function(arr,n){ return shuffle(arr.slice()).slice(0,n); }, sum=function(a){ let s=0; for(const v of a) s+=v; return s; };

  else if(lv===2){ st.pal=[1,2,5]; st.L=[ri(3,5),ri(3,5)]; }
  else if(lv===3){ st.pal=[2,3,5]; st.L=[sum(pick([2,3,5,2,3],ri(2,3)))]; }
  else if(lv===4){ st.items=[1,2,3,4,5,6]; st.L=[sum(pick(st.items,3))]; }

  else if(lv===6){ st.items=[10,5,5,2,2,1,1]; st.L=[sum(pick(st.items,ri(3,4)))]; }

  else if(lv===8){ const b=ri(2,5), a=ri(1,4); st.box=b; st.L=[-1,-1,a]; st.R=[{w:2*b+a,fix:1}]; }
  else{ const b=ri(2,6), a=ri(1,3); st.box=b; st.L=[-1,-1,a]; st.R=[{w:-1,fix:1},{w:b+a,fix:1}]; }
  if(st.items) st.items=st.items.map(function(w){ return {w:w,used:false}; });
  if(st.box){ const o=[st.box]; for(const v of shuffle([st.box-1,st.box+1,st.box+2,st.box-2,st.box+3])) if(o.length<4&&v>0&&o.indexOf(v)<0) o.push(v); st.opts=shuffle(o); }

}
function wgDiff(st){ let d=0; for(const v of st.L) d+=v<0?st.box:v; for(const q of st.R) d-=q.w<0?st.box:q.w; return d; }

/* ---------- 6. Rohre: Rohrstücke drehen, bis das Wasser von links bis zur Pflanze fließt. ---------- */
const RHL=[[3,2,0],[3,3,0],[4,3,0],[4,4,0],[4,4,1],[5,4,1],[5,5,1],[5,5,2],[6,5,2],[6,6,2]], RMASK=[10,3,11];
const RSVG=['<path d="M0 12h24"','<path d="M12 0v5a7 7 0 0 0 7 7h5"','<path d="M0 12h24M12 0v12"'];
function rhRot(m,r){ for(let i=0;i<r;i++) m=((m<<1)&15)|(m>>3); return m; }
function rhMask(st,p){ return st.t[p]===3?0:rhRot(RMASK[st.t[p]],st.r[p]); }
function rhFlow(st){
  const w=st.w, h=st.h, f=new Set(), s=st.ys*w, N=[[1,0,-1,4],[2,1,0,8],[4,0,1,1],[8,-1,0,2]];
  if(!(rhMask(st,s)&8)) return f;
  const q=[s]; f.add(s);
  while(q.length){
    const p=q.pop(), x=p%w, y=(p-x)/w, m=rhMask(st,p);
    for(const n of N){
      if(!(m&n[0])) continue;
      const nx=x+n[1], ny=y+n[2];
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const np=ny*w+nx;
      if(f.has(np)||!(rhMask(st,np)&n[3])) continue;
      f.add(np); q.push(np);
    }
  }
  return f;
}
function rhDone(st,f){ const e=st.ye*st.w+st.w-1; return f.has(e)&&(rhMask(st,e)&2)>0; }
function mkRohre(lv){
  const L=RHL[lv], w=L[0], h=L[1];
  for(let tr=0;tr<80;tr++){
    const ys=ri(0,h-1), ye=ri(0,h-1), seen=new Set(), path=[];
    const dfs=function(x,y){
      const p=y*w+x; seen.add(p); path.push(p);
      if(x===w-1&&y===ye) return true;
      for(const d of shuffle([[1,0],[0,1],[0,-1],[-1,0]])){
        const nx=x+d[0], ny=y+d[1];
        if(nx<0||ny<0||nx>=w||ny>=h||seen.has(ny*w+nx)) continue;
        if(dfs(nx,ny)) return true;
      }
      path.pop(); return false;
    };
    if(!dfs(0,ys)) continue;
    if(path.length<Math.min(w+1+(lv>>1),w*h-2)||path.length>w*h*.75) continue;
    const st={w:w,h:h,ys:ys,ye:ye,t:[],r:[],sr:[],lk:[],ang:[],need:0,taps:0};
    const on={};
    for(let i=0;i<path.length;i++){
      const p=path[i], x=p%w, y=(p-x)/w; let m=0;
      for(const q of [i?path[i-1]:-1,i<path.length-1?path[i+1]:-2]){
        if(q===-1) m|=8; else if(q===-2) m|=2;
        else{ const qx=q%w, qy=(q-qx)/w; m|=qx>x?2:qx<x?8:qy>y?4:1; }
      }
      on[p]=m;
    }
    for(let p=0;p<w*h;p++){
      let t, r, sr=-1;
      if(on[p]!==undefined){
        const m=on[p];
        t=(m===10||m===5)?0:1;
        if(L[2]>=1&&Math.random()<.22) t=2;
        sr=0; while((rhRot(RMASK[t],sr)&m)!==m) sr++;
        r=(sr+ri(1,3))%4;
        if(t===0&&(r&1)===(sr&1)) r=(r+1)%4;
        st.need+=t===0?1:Math.min((sr-r+4)%4,4);
      }else{
        const q=Math.random();
        t=L[2]>=2&&q<.14?3:L[2]>=1&&q<.4?2:q<.72?1:0; r=ri(0,3);
      }
      st.t.push(t); st.r.push(r); st.sr.push(sr); st.lk.push(false); st.ang.push(r*90);
    }
    if(rhDone(st,rhFlow(st))) continue;
    return st;
  }
  return mkRohre(Math.max(0,lv-1));
}
function drRohre(st){
  const cs=pzCell(st.w+2,st.h,false), f=rhFlow(st), done=rhDone(st,f);
  let h='<div class="pzg" style="--cs:'+cs+'px;grid-template-columns:repeat('+(st.w+2)+',var(--cs))">';
  for(let y=0;y<st.h;y++){
    h+='<span class="ends" aria-hidden="true">'+(y===st.ys?'🚰':'')+'</span>';
    for(let x=0;x<st.w;x++){
      const p=y*st.w+x, t=st.t[p];
      if(t===3) h+='<span class="pzc pp rock"></span>';
      else h+='<button class="pzc pp'+(f.has(p)?' wet':'')+(st.lk[p]?' lk':'')+'" data-a="'+p+'" aria-label="Rohr drehen"><svg viewBox="0 0 24 24" style="transform:rotate('+st.ang[p]+'deg)" aria-hidden="true">'+RSVG[t]+' stroke="currentColor" stroke-width="7" fill="none"/></svg></button>';
    }
    h+='<span class="ends"'+(y===st.ye?' id="pz-sink"':'')+' aria-hidden="true">'+(y===st.ye?(done?'🌻':'🌱'):'')+'</span>';
  }
  return [h+'</div>',''];
}
function rhPaint(st){
  const f=rhFlow(st), done=rhDone(st,f);
  for(const b of $('pz-body').querySelectorAll('[data-a]')) b.classList.toggle('wet',f.has(+b.dataset.a));

}
function acRohre(st,a,b){
  const p=+a; if(st.lk[p]) return;
  st.r[p]=(st.r[p]+1)%4; st.ang[p]+=90; st.taps++;
  b.firstChild.style.transform='rotate('+st.ang[p]+'deg)'; sfx('tick');

}
function hiRohre(st){
  const bad=idxs(st.t.length).filter(function(p){ return st.sr[p]>=0&&!st.lk[p]; });
  const wrong=bad.filter(function(p){ return st.t[p]===0?(st.r[p]&1)!==(st.sr[p]&1):st.r[p]!==st.sr[p]; });
  const pick=wrong.length?wrong:bad;
  if(pick.length){
    const p=pick[ri(0,pick.length-1)], d=(st.sr[p]-st.r[p]+4)%4;

/* ---------- 7. Bilder-Sudoku: In jeder Reihe und Spalte kommt jedes Bild genau einmal vor. ---------- */
const SDL=[[3,2],[3,3],[3,4],[3,5],[3,6],[4,4],[4,6],[4,7],[4,8],[4,10]];
function sdOk(a,n,i,v){

const BAK_DBS=['lavaland','lavaland-log'];

function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function enc(v){
  if(ArrayBuffer.isView(v)) return {$t:v.constructor.name,$b:b64(new Uint8Array(v.buffer,v.byteOffset,v.byteLength))};
  if(v instanceof ArrayBuffer) return {$t:'ArrayBuffer',$b:b64(new Uint8Array(v))};
  if(v instanceof Date) return {$t:'Date',$d:v.getTime()};
  if(Array.isArray(v)) return v.map(enc);
  if(v&&typeof v==='object'){ const o={}; for(const k in v) o[k]=enc(v[k]); return o; }
  return v;
}
function dec(v){
  if(Array.isArray(v)) return v.map(dec);
  if(v&&typeof v==='object'){
    if(typeof v.$t==='string'){
      if(v.$t==='Date') return new Date(v.$d);
      const u=unb64(v.$b);
      if(v.$t==='ArrayBuffer') return u.buffer;
      const T=window[v.$t]; if(typeof T==='function'&&/Array$/.test(v.$t)) return new T(u.buffer);
    }
    const o={}; for(const k in v) o[k]=dec(v[k]); return o;
  }
  return v;
}
/* Eine Datenbank, die es hier noch nicht gibt, wird beim Lesen nicht angelegt: das Anlegen wird abgebrochen. */
function dbDump(name){
  return new Promise(function(res){
    let rq;
    try{ rq=indexedDB.open(name); }catch(_){ res(null); return; }
    rq.onupgradeneeded=function(){ try{ rq.transaction.abort(); }catch(_){} };
    rq.onerror=function(e){ if(e&&e.preventDefault) e.preventDefault(); res(null); };
    rq.onsuccess=function(){
      const db=rq.result, names=Array.prototype.slice.call(db.objectStoreNames);
      if(!names.length){ db.close(); res(null); return; }
      const out={v:db.version,st:{}}, tx=db.transaction(names,'readonly');
      names.forEach(function(n){
        const os=tx.objectStore(n), e={kp:os.keyPath,ai:os.autoIncrement,k:[],r:[]};
        out.st[n]=e;
        os.getAllKeys().onsuccess=function(ev){ e.k=ev.target.result; };
        os.getAll().onsuccess=function(ev){ e.r=ev.target.result; };
      });
      tx.oncomplete=function(){ db.close(); res(out); };
      tx.onerror=tx.onabort=function(){ db.close(); res(null); };
    };
  });
}
function dbLoad(name,d){
  const go=function(ver){
    return new Promise(function(res,rej){
      let rq;
      try{ rq=ver?indexedDB.open(name,ver):indexedDB.open(name); }catch(e){ rej(e); return; }
      rq.onupgradeneeded=function(){
        const db=rq.result;
        for(const n in d.st) if(!db.objectStoreNames.contains(n)){ const o={autoIncrement:!!d.st[n].ai}; if(d.st[n].kp!=null) o.keyPath=d.st[n].kp; db.createObjectStore(n,o); }
      };
      rq.onerror=function(e){ if(e&&e.preventDefault) e.preventDefault(); rej(rq.error); };
      rq.onsuccess=function(){
        const db=rq.result, names=Object.keys(d.st).filter(function(n){ return db.objectStoreNames.contains(n); });
        if(!names.length){ db.close(); res(); return; }
        const tx=db.transaction(names,'readwrite');
        names.forEach(function(n){
          const os=tx.objectStore(n), e=d.st[n];
          os.clear();
          for(let i=0;i<e.r.length;i++){ if(os.keyPath!=null) os.put(e.r[i]); else os.put(e.r[i],e.k[i]); }
        });
        tx.oncomplete=function(){ db.close(); res(); };
        tx.onerror=tx.onabort=function(){ db.close(); rej(tx.error); };
      };
    });
  };
  /* Ist die Datenbank hier schon neuer als in der Datei, wird sie in ihrer jetzigen Fassung geöffnet. */
  return go(d.v).catch(function(e){ if(e&&e.name==='VersionError') return go(0); throw e; });
}

}
